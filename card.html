body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;padding-bottom:60px;overflow-x:hidden;position:relative;min-height:100vh}
.fx-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffe4ea 0%,#ffb3c6 50%,#ff8fa3 100%);border-radius:18px 0 18px 0;box-shadow:0 2px 6px rgba(255,158,181,.3);opacity:.85;animation:fall ease-in-out infinite}
.bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(135,206,250,.32));border:1.5px solid rgba(173,216,230,.65);box-shadow:0 2px 8px rgba(135,206,250,.2);animation:rise ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:0 16px}
.stat{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:26px;padding:16px 24px;box-shadow:0 6px 20px rgba(226,158,168,.12);border:2px solid #f9dfe3;margin-bottom:22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.stat-badge{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.item{text-align:center;background:#fff7f8;padding:8px 20px;border-radius:20px;border:1.5px solid #f7d7dc;display:flex;align-items:baseline;gap:8px}
.val{font-size:1.45rem;font-weight:800;color:#c76272}
.lbl{font-size:.92rem;color:#947479;font-weight:800}
.stat-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.complete-banner{font-size:.92rem;font-weight:800;color:#1e8e3e;background:#edf9f0;border:1.5px solid #bfe6c9;padding:8px 16px;border-radius:20px}
.sync-cards-btn{background:#fff;border:1.5px solid #f0a8b4;color:#c76272;padding:8px 14px;border-radius:20px;font-size:.84rem;font-weight:800;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:4px}
.sync-cards-btn:hover{background:#fff0f3;transform:translateY(-1px)}

.viewer-box{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:26px;padding:18px;box-shadow:0 6px 20px rgba(226,158,168,.12);border:2px solid #f9dfe3;margin-bottom:22px;text-align:center;scroll-margin-top:76px;transition:box-shadow .35s ease,border-color .35s ease}
.viewer-box.highlight-flash{border-color:#f08da0;box-shadow:0 0 0 4px rgba(240,141,160,.22),0 8px 24px rgba(226,158,168,.2)}
.viewer-title{font-size:1.02rem;color:#c76272;margin-bottom:10px;font-weight:800}

/* 多版本小卡切換列 */
.variant-bar{display:none;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.variant-bar.show{display:flex}
.var-pill{padding:6px 14px;border-radius:16px;border:1.5px solid #f0a8b4;background:#fff8f9;color:#7a5c61;font-size:.84rem;font-weight:800;cursor:pointer;transition:.18s}
.var-pill:hover{border-color:#c76272;color:#c76272;transform:translateY(-1px)}
.var-pill.active{background:linear-gradient(135deg,#ff8fa3,#e26d82);border-color:#e26d82;color:#fff;box-shadow:0 3px 10px rgba(226,109,130,.28)}

.viewer-container{position:relative;width:100%;height:620px;max-height:76vh;border:2.5px dashed #efc4cb;border-radius:22px;background:#fff9fa;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden}
.viewer-img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.08);transition:opacity .2s ease;cursor:zoom-in}
.viewer-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:2px solid #f0a8b4;background:rgba(255,255,255,.9);color:#c76272;font-size:1.1rem;font-weight:900;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(226,158,168,.25);transition:.18s;z-index:2}
.viewer-nav-btn:hover{background:#c76272;border-color:#c76272;color:#fff;transform:translateY(-50%) scale(1.06)}
.viewer-nav-btn.prev{left:12px}
.viewer-nav-btn.next{right:12px}
.viewer-nav-btn.show{display:inline-flex}
.viewer-hint{font-size:.8rem;color:#947479;margin-top:8px;font-weight:700}

.job-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.job-btn{padding:8px 18px;border-radius:24px;cursor:pointer;font-size:.9rem;font-weight:800;transition:.2s;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.04)}
.job-btn:hover{transform:translateY(-2px)}
.job-all{border:2px solid #a89396;color:#7d686b}
.job-all.active{background:#947e81;border-color:#947e81;color:#fff}
.job-knight{border:2px solid #f39c12;color:#d68910}
.job-knight.active{background:#f39c12;color:#fff}
.job-mage{border:2px solid #38bdf8;color:#0284c7}
.job-mage.active{background:#38bdf8;color:#fff}
.job-fighter{border:2px solid #b91c1c;color:#991b1b}

.job-sage{border:2px solid #10b981;color:#047857}
.job-sage.active{background:#10b981;color:#fff}

.box{background:rgba(255,255,255,.94);backdrop-filter:blur(6px);border-radius:26px;padding:22px;box-shadow:0 6px 20px rgba(226,158,168,.12);border:2px solid #f9dfe3}
.hd{font-size:1.05rem;font-weight:800;color:#c76272;margin-bottom:16px;padding-bottom:10px;border-bottom:2px dashed #f9dfe3;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.hint{font-size:.84rem;color:#947479;font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:10px}

.ok{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;background:#edf9f0;color:#1e8e3e;border-radius:24px;font-weight:800;font-size:.92rem;border:1.5px solid #bfe6c9;transition:.2s;cursor:pointer;box-shadow:0 2px 5px rgba(30,142,62,.08)}
.ok:hover,.ok.selected{background:#27ae60;border-color:#27ae60;color:#fff;transform:translateY(-2px)}

.bg-術士{background:#38bdf8}

    .viewer-nav-btn{width:34px;height:34px;font-size:.95rem}

<script>
const CARD_OWNER = "qscxz19920516";
const CARD_REPO = "Kakan";
const CARD_ROOT = "角色圖鑑";
const CARD_CACHE_KEY = "huajian_kakan_cards_v3_" + CARD_OWNER + "_" + CARD_REPO;

const membersData = [

    { name: "秋月", job: "賢者" },
    { name: "兔兔呦", job: "術士" },
    { name: "糖糖", job: "賢者" },
    { name: "鬼見愁", job: "術士" },
    { name: "睡喵", job: "賢者" },
    { name: "香香", job: "術士" },
    { name: "阿然", job: "賢者" },
    { name: "烏拉", job: "騎士" },
    { name: "獅獅", job: "賢者" },
    { name: "克咪", job: "賢者" },
    { name: "寶哥", job: "賢者" },
    { name: "STORM", job: "賢者" },
    { name: "喵來", job: "術士" }
];

let curJob = 'all';
let selectedMember = '';
let memberCardsMap = {};
let currentVariants = [];
let currentVariantIdx = 0;

function formatVariantLabel(memberName, fileName, idx) {
    const base = fileName.replace(/\.(jpg|jpeg|png|webp|gif)$/i, '').trim();
    return base || `${memberName}_${String(idx + 1).padStart(2, '0')}`;
}

function getFallbackVariants(name) {
    if (name === '小卡預設卡') {
        return [{
            label: '小卡預設卡',
            path: `${CARD_ROOT}/小卡預設卡.jpg`,
            fallbacks: [
                `${CARD_ROOT}/小卡預設卡.JPG`,
                `${CARD_ROOT}/小卡預設卡.png`,
                `小卡預設卡.jpg`,
                `花間/小卡預設卡.jpg`
            ]
        }];
    }
    return [{
        label: `${name}_01`,
        path: `${CARD_ROOT}/${name}/${name}_01.jpg`,
        fallbacks: [
            `${CARD_ROOT}/${name}/${name}_01.JPG`,
            `${CARD_ROOT}/${name}/${name}_01.png`,
            `${CARD_ROOT}/${name}/${name}_01.PNG`,
            `${CARD_ROOT}/${name}/${name}_01.webp`,
            `${CARD_ROOT}/${name}/${name}.jpg`,
            `${name}.jpg`
        ]
    }];
}

async function fetchMemberCardsMap(bypassCache = false) {
    try {
        sessionStorage.removeItem("huajian_kakan_cards_v1_" + CARD_OWNER + "_" + CARD_REPO);
        sessionStorage.removeItem("huajian_kakan_cards_v2_" + CARD_OWNER + "_" + CARD_REPO);
    } catch (e) {}

    if (!bypassCache) {
        try {
            const cached = sessionStorage.getItem(CARD_CACHE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (parsed && Object.keys(parsed).length > 0) return parsed;
            }
        } catch (e) {}
    }

    const branches = ['main', 'master'];
    try {
        const repoRes = await fetch(`https://api.github.com/repos/${CARD_OWNER}/${CARD_REPO}?_=${Date.now()}`);
        if (repoRes.ok) {
            const info = await repoRes.json();
            if (info && info.default_branch && !branches.includes(info.default_branch)) {
                branches.unshift(info.default_branch);
            }
        }
    } catch (e) {}

    for (const br of branches) {
        try {
            const branchRes = await fetch(`https://api.github.com/repos/${CARD_OWNER}/${CARD_REPO}/branches/${br}?_=${Date.now()}`);
            let treeSha = br;
            if (branchRes.ok) {
                const bData = await branchRes.json();
                if (bData && bData.commit && bData.commit.commit && bData.commit.commit.tree) {
                    treeSha = bData.commit.commit.tree.sha;
                }
            }

            const res = await fetch(`https://api.github.com/repos/${CARD_OWNER}/${CARD_REPO}/git/trees/${treeSha}?recursive=1&_=${Date.now()}`);
            if (!res.ok) continue;
            const data = await res.json();
            if (!data.tree) continue;

            const rawMap = {};
            data.tree.forEach(item => {
                if (item.type !== 'blob') return;
                if (!/\.(jpg|jpeg|png|webp|gif)$/i.test(item.path)) return;
                const parts = item.path.split('/');
                if (parts[0] !== CARD_ROOT && parts[0] !== '腳色圖鑑') return;

                if (parts.length === 2) {
                    const base = parts[1].replace(/\.(jpg|jpeg|png|webp|gif)$/i, '');
                    if (!rawMap[base]) rawMap[base] = [];
                    rawMap[base].push({ fileName: parts[1], path: item.path });
                } else if (parts.length >= 3) {
                    const memberName = parts[1];
                    const fileName = parts[parts.length - 1];
                    if (!rawMap[memberName]) rawMap[memberName] = [];
                    rawMap[memberName].push({ fileName, path: item.path });
                }
            });

            const formattedMap = {};
            Object.keys(rawMap).forEach(mName => {
                const sorted = rawMap[mName].sort((a, b) =>
                    a.fileName.localeCompare(b.fileName, 'zh-Hant', { numeric: true })
                );
                formattedMap[mName] = sorted.map((entry, idx) => ({
                    label: formatVariantLabel(mName, entry.fileName, idx),
                    path: entry.path,
                    fallbacks: []
                }));
            });

            if (Object.keys(formattedMap).length > 0) {
                try { sessionStorage.setItem(CARD_CACHE_KEY, JSON.stringify(formattedMap)); } catch (e) {}
                return formattedMap;
            }
        } catch (e) {}
    }
    return {};
}

function renderVariantControls() {
    const bar = document.getElementById('variantBar');
    const prevBtn = document.getElementById('prevCardBtn');
    const nextBtn = document.getElementById('nextCardBtn');
    const hasMultiple = currentVariants.length > 1;

    if (prevBtn) prevBtn.classList.toggle('show', hasMultiple);
    if (nextBtn) nextBtn.classList.toggle('show', hasMultiple);

    if (!bar) return;
    if (!hasMultiple) {
        bar.classList.remove('show');
        bar.innerHTML = '';
        return;
    }

    bar.classList.add('show');
    bar.innerHTML = currentVariants.map((v, idx) => {
        const act = idx === currentVariantIdx ? ' active' : '';
        return `<button type="button" class="var-pill${act}" onclick="selectVariant(${idx})">🃏 ${v.label}</button>`;
    }).join('');
}

function selectVariant(idx) {
    if (!currentVariants.length) return;
    currentVariantIdx = (idx + currentVariants.length) % currentVariants.length;
    const item = currentVariants[currentVariantIdx];

    const titleSuffix = currentVariants.length > 1
        ? `【${item.label}】（${currentVariantIdx + 1}/${currentVariants.length}）`
        : '';
    document.getElementById('viewerTitle').innerText =
        selectedMember === '小卡預設卡'
            ? '🖼️ 角色圖片預覽區（點擊下方成員名字即可在此切換顯示）'
            : `🖼️ 目前預覽：${selectedMember} ${titleSuffix}`;

    const img = document.getElementById('viewerImg');
    const queue = [item.path, ...(item.fallbacks || [])];
    let attempt = 0;

    img.onerror = function() {
        attempt++;
        if (attempt < queue.length) {
            this.src = queue[attempt];
        } else {
            this.onerror = null;
        }
    };
    img.src = queue[0];
    renderVariantControls();
}

function stepVariant(delta) {
    if (currentVariants.length <= 1) return;
    selectVariant(currentVariantIdx + delta);
}

function showImg(name, shouldScroll = true) {
    selectedMember = name;
    const scanned = memberCardsMap[name];
    currentVariants = (scanned && scanned.length > 0) ? scanned : getFallbackVariants(name);
    currentVariantIdx = 0;
    selectVariant(0);

    document.querySelectorAll('#member-list .ok').forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.name === name);
    });

    if (shouldScroll) {
        const viewerBox = document.getElementById('viewerBox');
        if (viewerBox) {
            viewerBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
            viewerBox.classList.remove('highlight-flash');
            void viewerBox.offsetWidth;
            viewerBox.classList.add('highlight-flash');
            setTimeout(() => viewerBox.classList.remove('highlight-flash'), 900);
        }
    }
}

function resetPreview() {
    showImg('小卡預設卡', false);
}

function openCardZoom() {
    const img = document.getElementById('viewerImg');
    if (!img || !img.src) return;
    document.getElementById('zoomModalImg').src = img.src;
    document.getElementById('zoomModalTitle').textContent = document.getElementById('viewerTitle').innerText.replace(/^🖼️\s*目前預覽：/, '');
    document.getElementById('zoomModal').classList.add('open');
}

function closeCardZoom() {
    document.getElementById('zoomModal').classList.remove('open');
}

function setJob(jb) {
    curJob = jb;
    document.querySelectorAll('.job-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('jb-' + jb).classList.add('active');
    resetPreview();
    renderList();
}

function renderList() {
    const filtered = membersData.filter(m => curJob === 'all' || m.job === curJob);
    const jbText = curJob === 'all' ? '全部職業' : curJob;
    document.getElementById('list-title').innerText = `🌸 ${jbText}（共 ${filtered.length} 人）`;

    let html = '';
    filtered.forEach(m => {
        const badge = `<span class="j-badge bg-${m.job}">${m.job}</span>`;
        const activeCls = m.name === selectedMember ? ' selected' : '';
        html += `<button class="ok${activeCls}" data-name="${m.name}" onclick="showImg('${m.name}', true)">🖼️ ${m.name} ${badge}</button>`;
    });
    document.getElementById('member-list').innerHTML = html || '<span style="color:#947479">目前此分類沒有成員喔～</span>';
}

function createEffects() {
    const bg = document.getElementById('fxBg');
    for (let i = 0; i < 45; i++) {
        const p = document.createElement('div');
        p.className = 'petal';
        const size = 9 + Math.random() * 13;
        p.style.width = size + 'px';
        p.style.height = (size * 0.75) + 'px';
        p.style.left = (Math.random() * 100) + 'vw';
        p.style.animationDuration = (6 + Math.random() * 8) + 's';
        p.style.animationDelay = (-Math.random() * 10) + 's';
        bg.appendChild(p);
    }
    for (let i = 0; i < 25; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 20 + Math.random() * 45;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (Math.random() * 100) + 'vw';
        b.style.animationDuration = (10 + Math.random() * 10) + 's';
        b.style.animationDelay = (-Math.random() * 8) + 's';
        bg.appendChild(b);
    }
}

async function syncMemberCards(bypassCache = false) {
    const btn = document.getElementById('syncCardsBtn');
    const banner = document.getElementById('cardStatusBanner');
    if (btn) btn.textContent = '⏳ 掃描中...';

    try {
        const scanned = await fetchMemberCardsMap(bypassCache);
        if (scanned && Object.keys(scanned).length > 0) {
            memberCardsMap = scanned;
            const totalImgs = Object.values(scanned).reduce((sum, arr) => sum + arr.length, 0);
            if (banner) banner.textContent = `✨ 已同步收錄 ${totalImgs} 張專屬小卡（支援多版本切換）`;
        }
        renderList();
        if (selectedMember) {
            const keepIdx = currentVariantIdx;
            const updated = memberCardsMap[selectedMember];
            currentVariants = (updated && updated.length > 0) ? updated : getFallbackVariants(selectedMember);
            selectVariant(Math.min(keepIdx, currentVariants.length - 1));
        }
    } finally {
        if (btn) btn.textContent = '🔄 同步新小卡';
    }
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeCardZoom();
    if (currentVariants.length > 1 && !document.getElementById('zoomModal').classList.contains('open')) {
        if (e.key === 'ArrowLeft') stepVariant(-1);
        if (e.key === 'ArrowRight') stepVariant(1);
    }
});

async function init() {
    const total = membersData.length;
    document.getElementById('total-count').innerText = total;
    document.getElementById('jcnt-all').innerText = total;
    ['騎士', '術士', '鬥士', '賢者'].forEach(jb => {
        document.getElementById('jcnt-' + jb).innerText = membersData.filter(m => m.job === jb).length;
    });

    createEffects();
    resetPreview();
    renderList();
    await syncMemberCards(false);
}

init();
</script>
