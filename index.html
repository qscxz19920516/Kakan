<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花間小憩 - 角色圖鑑與製作進度</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif}
body{background:#fdf8f5;color:#4a3f41;line-height:1.6;padding-bottom:60px}
header{background:linear-gradient(135deg,#f9ecea,#f3dce0);padding:25px 20px;text-align:center;border-bottom:1px solid #f0e4e1;margin-bottom:20px}
header h1{font-size:1.8rem;color:#b56b74;letter-spacing:2px;margin-bottom:4px}
header p{color:#8c7b7e;font-size:.9rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 15px}

.stat{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 4px 15px rgba(212,140,149,.08);margin-bottom:20px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:15px}
.nums{display:flex;gap:20px}
.item{text-align:center}
.val{font-size:1.3rem;font-weight:700;color:#b56b74}
.lbl{font-size:.8rem;color:#8c7b7e}
.prog{flex:1;min-width:220px}
.ptxt{display:flex;justify-content:space-between;font-size:.85rem;margin-bottom:6px;font-weight:700}
.bar{height:10px;background:#f0e4e1;border-radius:10px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#d48c95,#b56b74);border-radius:10px;transition:width .5s ease}

.viewer-box{background:#fff;border-radius:16px;padding:15px;box-shadow:0 4px 15px rgba(212,140,149,.08);border:1px solid #f0e4e1;margin-bottom:20px;text-align:center}
.viewer-title{font-size:.9rem;color:#8c7b7e;margin-bottom:10px;font-weight:700}
.viewer-container{position:relative;width:100%;height:650px;max-height:78vh;border:2px dashed #e6d2cf;border-radius:12px;background:#faf4f2;display:flex;align-items:center;justify-content:center;padding:12px;overflow:hidden}
.viewer-img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.08)}


input[type="radio"]{display:none}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabs label{padding:8px 16px;border:1px solid #d48c95;color:#b56b74;border-radius:20px;cursor:pointer;font-size:.9rem;font-weight:700;transition:.2s}
#t1:checked~.tabs label[for="t1"],#t2:checked~.tabs label[for="t2"],#t3:checked~.tabs label[for="t3"]{background:#d48c95;color:#fff}
.pnl{display:none}
#t1:checked~.pnls #p1,#t2:checked~.pnls #p2,#t3:checked~.pnls #p3{display:block}
.box{background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 15px rgba(212,140,149,.08);border:1px solid #f0e4e1}
.hd{font-size:1rem;font-weight:700;color:#b56b74;margin-bottom:14px;padding-bottom:8px;border-bottom:1px dashed #f0e4e1;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.hint{font-size:.8rem;color:#8c7b7e;font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.ok{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#e6f4ea;color:#1e8e3e;text-decoration:none;border-radius:20px;font-weight:700;font-size:.9rem;border:1px solid #cce8d4;transition:.2s}
.ok:hover,.ok:focus{background:#1e8e3e;color:#fff;transform:translateY(-2px)}
.no{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#fef7e0;color:#b06000;border-radius:20px;font-weight:700;font-size:.9rem;border:1px solid #f7e4b2}

@media(max-width: 600px) {
    header h1{font-size:1.5rem}
    .viewer-container{height:400px}
    .tabs label{flex:1;text-align:center;padding:8px 10px;font-size:.85rem}
}
</style>
</head>
<body>
<header>
    <h1>🌸 花間小憩 角色圖鑑</h1>
    <p>成員名單與專屬角色圖片製作進度一覽</p>
</header>
<div class="wrap">
    <div class="stat">
        <div class="nums">
            <div class="item"><div class="val" id="total-count">0</div><div class="lbl">總人數</div></div>
            <div class="item"><div class="val" id="done-count" style="color:#1e8e3e">0</div><div class="lbl">已製作</div></div>
            <div class="item"><div class="val" id="pending-count" style="color:#b06000">0</div><div class="lbl">製作中</div></div>
        </div>
        <div class="prog">
            <div class="ptxt"><span>整體製作進度</span><span id="prog-text">0%</span></div>
            <div class="bar"><div class="fill" id="prog-bar" style="width: 0%;"></div></div>
        </div>
    </div>

    <div class="viewer-box">
        <div class="viewer-title" id="viewerTitle">🖼️ 角色圖片預覽區（點擊下方綠色成員名字即可在此直接切換顯示）</div>
        <div class="viewer-container">
            <img id="viewerImg" class="viewer-img" src="" alt="角色圖片預覽">
        </div>
    </div>

    <input type="radio" name="tabs" id="t1" checked>
    <input type="radio" name="tabs" id="t2">
    <input type="radio" name="tabs" id="t3">
    <div class="tabs">
        <label for="t1" onclick="resetPreview()">全部顯示 (<span id="tab-t1-cnt">0</span>)</label>
        <label for="t2" onclick="resetPreview()">已製作 (<span id="tab-t2-cnt">0</span>)</label>
        <label for="t3" onclick="resetPreview()">製作中 (<span id="tab-t3-cnt">0</span>)</label>
    </div>

    <div class="pnls">
        <div class="pnl" id="p1">
            <div class="box">
                <div class="hd"><span>🌸 全部成員總名單</span><span class="hint">點擊綠色名字可直接在上方預覽切換圖片</span></div>
                <div class="tags" id="list-all"></div>
            </div>
        </div>
        <div class="pnl" id="p2">
            <div class="box">
                <div class="hd"><span>✅ 已製作完成名單</span><span class="hint">點擊姓名可直接在上方預覽切換圖片</span></div>
                <div class="tags" id="list-done"></div>
            </div>
        </div>
        <div class="pnl" id="p3">
            <div class="box">
                <div class="hd"><span>⏳ 圖片製作中名單</span><span class="hint">尚未完成製作之成員</span></div>
                <div class="tags" id="list-pending"></div>
            </div>
        </div>
    </div>
</div>

<script>
// 在這裡設定「已經製作完成」的成員名單（只要把檔名有上傳到 GitHub 的寫進這裡即可！）
const doneMembers = [
    "壞壞呦", "薇糖", "47", "空弦", "阿燁", "一劍", "星星", "布布", "鯤鯤", "花龍", "蕭蕭", 
    "小杯", "小雨", "雷雷", "笙笙", "毒乃", "狼", "EE", "夜夜", "夜影", "貝貝", "百變", 
    "金冬狗", "茶茶", "貓龍", "星隕", "鴿子", "哩麥悶", "村村", "霜霜", "秋月", "兔兔呦", 
    "糖糖", "鬼見愁", "香香", "烏拉", "獅獅"
];

// 全部 51 人的總名單
const allMembers = [
    "壞壞呦", "薇糖", "47", "空弦", "阿燁", "一劍", "星星", "布布", "鯤鯤", "花龍", "蕭蕭", 
    "牙牙", "小杯", "小雨", "MO", "雷雷", "笙笙", "咕咕", "毒乃", "狼", "EE", "夜夜", 
    "乖乖呦", "夜影", "閃閃", "鼠鼠", "貝貝", "Yang", "百變", "露露", "金冬狗", "茶茶", 
    "夜悾", "貓龍", "星隕", "回皿回", "恩p西", "牛肉包", "鴿子", "哩麥悶", "村村", "霜霜", 
    "秋月", "兔兔呦", "糖糖", "鬼見愁", "睡喵", "香香", "克咪", "烏拉","寶哥","阿然","獅獅"
];

function showImg(name) {
    document.getElementById('viewerTitle').innerText = '🖼️ 目前預覽：' + name + '（點擊下方綠色名字切換圖片）';
    const img = document.getElementById('viewerImg');
    // 自動嘗試最外層或「花間/」資料夾內的圖片
    img.onerror = function() {
        this.onerror = null;
        this.src = '花間/' + name + '.jpg';
    };
    img.src = name + '.jpg';
}

function init() {
    let htmlAll = '';
    let htmlDone = '';
    let htmlPending = '';
    
    let doneCount = 0;
    let firstName = '';

    allMembers.forEach(name => {
        let isDone = doneMembers.includes(name);

        if (isDone) {
            doneCount++;
            if (!firstName) firstName = name;
            let tag = `<a class="ok" href="javascript:void(0)" onclick="showImg('${name}')">🖼️ ${name}</a>`;
            htmlAll += tag;
            htmlDone += tag;
        } else {
            let tag = `<span class="no">⏳ ${name}</span>`;
            htmlAll += tag;
            htmlPending += tag;
        }
    });

    const total = allMembers.length;
    const pending = total - doneCount;
    const percent = Math.round((doneCount / total) * 100);

    document.getElementById('total-count').innerText = total;
    document.getElementById('done-count').innerText = doneCount;
    document.getElementById('pending-count').innerText = pending;
    document.getElementById('prog-text').innerText = percent + '%';
    document.getElementById('prog-bar').style.width = percent + '%';

    document.getElementById('tab-t1-cnt').innerText = total;
    document.getElementById('tab-t2-cnt').innerText = doneCount;
    document.getElementById('tab-t3-cnt').innerText = pending;

    document.getElementById('list-all').innerHTML = htmlAll;
    document.getElementById('list-done').innerHTML = htmlDone;
    document.getElementById('list-pending').innerHTML = htmlPending;

    resetPreview();
}

function resetPreview() {
    showImg('茶茶');
}

init();
</script>
</body>
</html>
