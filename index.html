<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>花間小憩 - 首頁</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Rounded Mplus 1c",sans-serif}
body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative}
.fx-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffe4ea 0%,#ffb3c6 50%,#ff8fa3 100%);border-radius:18px 0 18px 0;box-shadow:0 2px 6px rgba(255,158,181,.3);opacity:.85;animation:fall ease-in-out infinite}
.bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(135,206,250,.32));border:1.5px solid rgba(173,216,230,.65);box-shadow:0 2px 8px rgba(135,206,250,.2);animation:rise ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,240,242,.92);backdrop-filter:blur(8px);border-bottom:2px dashed #f2bec7;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.menu-btn{background:#fff;border:2px solid #f0a8b4;color:#c76272;font-size:1.3rem;width:42px;height:42px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(226,158,168,.15)}
.brand{font-size:1.25rem;font-weight:800;color:#c76272;letter-spacing:1.5px}
.spacer{width:42px}

.drawer-mask{display:none;position:fixed;inset:0;background:rgba(90,70,73,.45);z-index:99}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;left:-290px;width:280px;height:100%;background:#fff;z-index:100;transition:left .3s ease;box-shadow:4px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer.open{left:0}
.drawer-hd{padding:20px;background:linear-gradient(135deg,#ffe5e2,#fbdce6);display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #f2bec7;flex-shrink:0}
.drawer-hd span{font-weight:800;color:#c76272;font-size:1.1rem}
.close-btn{background:#fff;border:none;color:#c76272;font-size:1.2rem;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800}
.drawer-list{list-style:none;padding:8px 0 30px;overflow-y:auto;flex:1}
.drawer-list li a{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;text-decoration:none;color:#5a4649;font-weight:800;font-size:1.05rem;border-bottom:1px solid #f7e8ea;transition:.2s}
.drawer-list li a:hover,.drawer-list li a.current{background:#fff6f7;color:#c76272}
.arrow{color:#c76272;font-weight:800;transition:transform .25s ease}
.sub-toggle{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:#5a4649;font-weight:800;font-size:1.05rem;border-bottom:1px solid #f7e8ea;cursor:pointer;transition:.2s}
.sub-toggle:hover{background:#fff6f7;color:#c76272}
.arrow.rot{transform:rotate(90deg)}
.submenu{display:none;list-style:none;background:#fffafa}
.submenu.open{display:block}
.submenu li a{padding:14px 20px 14px 36px;font-size:.96rem;border-bottom:1px dashed #f7e8ea;color:#7a5c61}

.wrap{position:relative;z-index:1;max-width:760px;margin:22px auto 40px;padding:0 16px}
.hero{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 8px 25px rgba(226,158,168,.16);border:2px solid #f9dfe3;margin-bottom:22px}
.hero h1{font-size:1.95rem;color:#c76272;margin-bottom:8px;text-shadow:1px 1px 0 #fff}
.hero p{color:#8c7075;font-size:.96rem;margin-bottom:22px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:640px;margin:0 auto}
.portal{display:block;text-decoration:none;background:#fff8f9;border:2px dashed #f2bec7;border-radius:22px;padding:22px 14px;transition:.25s}
.portal:hover{transform:translateY(-4px);background:#fff;border-style:solid;box-shadow:0 8px 20px rgba(235,168,178,.22)}
.portal-icon{font-size:2.6rem;display:block;margin-bottom:8px}
.portal-title{font-size:1.15rem;font-weight:800;color:#c76272;margin-bottom:4px}
.portal-desc{font-size:.84rem;color:#947479;line-height:1.45}

.story-card{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:28px;padding:18px;box-shadow:0 8px 25px rgba(226,158,168,.16);border:2px solid #f9dfe3;text-align:center}
.story-hd{font-size:1.05rem;font-weight:800;color:#c76272;margin-bottom:12px;letter-spacing:1px}
.story-img-wrap{max-width:600px;margin:0 auto;border-radius:20px;overflow:hidden;border:2px dashed #f2bec7;background:#fff9fa}
.story-img{width:100%;height:auto;display:block;object-fit:contain;cursor:zoom-in;transition:transform .25s}
.story-img:hover{transform:scale(1.01)}
.story-hint{font-size:.82rem;color:#947479;margin-top:10px;font-weight:700}

.zoom-modal{display:none;position:fixed;inset:0;background:rgba(40,28,30,.82);z-index:200;align-items:center;justify-content:center;padding:16px}
.zoom-modal.open{display:flex}
.zoom-card{position:relative;background:#fff;padding:10px;border-radius:22px;border:3px solid #f9dfe3;max-width:95vw;max-height:92vh;box-shadow:0 15px 35px rgba(0,0,0,.35)}
.zoom-card img{max-width:90vw;max-height:86vh;object-fit:contain;border-radius:14px;display:block}

@media(max-width:520px){
    .hero{padding:24px 14px}
    .hero h1{font-size:1.65rem}
    .cards{gap:10px}
    .portal{padding:18px 10px}
    .portal-icon{font-size:2.2rem}
    .portal-title{font-size:1.02rem}
    .portal-desc{font-size:.78rem}
    .story-card{padding:14px 12px}
}
</style>
<script>
const SITE_VERSION = "20261120_v4";
(function(){
    const url = new URL(window.location.href);
    if (url.searchParams.get("v") !== SITE_VERSION) {
        url.searchParams.set("v", SITE_VERSION);
        window.location.replace(url.toString());
    }
})();
</script>
</head>
<body>
<div class="fx-bg" id="fxBg"></div>

<div class="topbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="brand">🌸 花間小憩 🌸</div>
    <div class="spacer"></div>
</div>

<div class="drawer-mask" id="mask" onclick="toggleMenu()"></div>
<nav class="drawer" id="drawer">
    <div class="drawer-hd">
        <span>🌸 花間小憩選單</span>
        <button class="close-btn" onclick="toggleMenu()">✕</button>
    </div>
    <ul class="drawer-list">
        <li><a href="index.html" class="current"><span>🏠 首頁</span><span class="arrow">&gt;</span></a></li>
        <li><a href="MeowMilk.html"><span>🥛 喵喵乳糖挑戰</span><span class="arrow">&gt;</span></a></li>
        <li><a href="card.html"><span>🎴 小卡圖鑑</span><span class="arrow">&gt;</span></a></li>
        <li>
            <div class="sub-toggle" onclick="toggleSubMenu()"><span>🎁 驚喜盲盒</span><span class="arrow" id="subArrow">&gt;</span></div>
            <ul class="submenu" id="subMenu"></ul>
        </li>
    </ul>
</nav>

<div class="wrap">
    <div class="hero">
        <h1>✨ 歡迎來到花間小憩 ✨</h1>
        <p>點擊左上角選單或下方卡片，探索成員專屬小卡與驚喜盲盒！</p>
        <div class="cards">
            <a href="card.html" class="portal">
                <span class="portal-icon">🎴</span>
                <div class="portal-title">成員小卡圖鑑</div>
                <div class="portal-desc">查看全體 56 位成員專屬小卡與四大職業介紹</div>
            </a>
            <a href="box.html" class="portal">
                <span class="portal-icon">🎁</span>
                <div class="portal-title">驚喜盲盒區</div>
                <div class="portal-desc">花間小憩專屬盲盒活動專區</div>
            </a>
            <a href="MeowMilk.html" class="portal">
                <span class="portal-icon">🥛</span>
                <div class="portal-title">喵喵乳糖挑戰</div>
                <div class="portal-desc">一劍友情灌奶的花間大亂鬥遊戲</div>
            </a>
        </div>
    </div>

    <div class="story-card">
        <div class="story-hd">🌸 關於 KaKan・名字背後的故事 🌸</div>
        <div class="story-img-wrap">
            <img class="story-img" src="Kakan的原.jpg?v=20261120_v4" alt="KaKan 名字背後的意義" onclick="openZoom()" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='Kakan的原.JPG?v=20261120_v4';}else if(this.dataset.step==1){this.dataset.step=2;this.src='花間/Kakan的原.jpg?v=20261120_v4';}else{this.onerror=null;this.src='花間/Kakan的原.JPG?v=20261120_v4';}">
        </div>
        <div class="story-hint">🔍 點擊圖片可全螢幕放大閱讀文字細節</div>
    </div>
</div>

<div class="zoom-modal" id="zoomModal" onclick="if(event.target===this) closeZoom()">
    <div class="zoom-card">
        <button class="close-btn" onclick="closeZoom()" style="position:absolute;top:-14px;right:-14px;box-shadow:0 3px 10px rgba(0,0,0,.2)">✕</button>
        <img src="Kakan的原.jpg?v=20261120_v4" alt="KaKan 名字背後的意義" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='Kakan的原.JPG?v=20261120_v4';}else if(this.dataset.step==1){this.dataset.step=2;this.src='花間/Kakan的原.jpg?v=20261120_v4';}else{this.onerror=null;this.src='花間/Kakan的原.JPG?v=20261120_v4';}">
    </div>
</div>

<script src="menu-sync.js?v=20261120_v4"></script>
<script>
function toggleMenu(){
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('mask').classList.toggle('open');
}
function toggleSubMenu(){
    document.getElementById('subMenu').classList.toggle('open');
    document.getElementById('subArrow').classList.toggle('rot');
}
function openZoom(){
    document.getElementById('zoomModal').classList.add('open');
}
function closeZoom(){
    document.getElementById('zoomModal').classList.remove('open');
}

window.addEventListener('DOMContentLoaded', async function(){
    const bg=document.getElementById('fxBg');
    for(let i=0;i<45;i++){
        const p=document.createElement('div');p.className='petal';
        const s=9+Math.random()*13;p.style.width=s+'px';p.style.height=(s*.75)+'px';
        p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(6+Math.random()*8)+'s';
        p.style.animationDelay=(-Math.random()*10)+'s';bg.appendChild(p);
    }
    for(let i=0;i<25;i++){
        const b=document.createElement('div');b.className='bubble';
        const s=20+Math.random()*45;b.style.width=s+'px';b.style.height=s+'px';
        b.style.left=(Math.random()*100)+'vw';b.style.animationDuration=(10+Math.random()*10)+'s';
        b.style.animationDelay=(-Math.random()*8)+'s';bg.appendChild(b);
    }
    if (window.HuajianMenu) {
        const cfg = await window.HuajianMenu.fetchAllSeries();
        window.HuajianMenu.renderSharedSubMenu(cfg);
    }
});
</script>
</body>
</html>
