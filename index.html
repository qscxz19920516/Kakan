body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative}

@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.wrap{position:relative;z-index:1;max-width:760px;margin:22px auto 40px;padding:0 16px}
.hero{background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-radius:28px;padding:30px 22px;text-align:center;box-shadow:0 8px 25px rgba(226,158,168,.16);border:2px solid #f9dfe3;margin-bottom:22px}

})();

<script>
function openZoom(customSrc){
    const zImg = document.getElementById('zoomModalImg');
    if (customSrc) {
        zImg.onerror = null;
        zImg.src = customSrc;
    } else {
        zImg.dataset.step = '';
        zImg.onerror = function(){
            if(!this.dataset.step){this.dataset.step=1;this.src='Kakan的原.JPG?v=20261120_v4';}
            else if(this.dataset.step==1){this.dataset.step=2;this.src='花間/Kakan的原.jpg?v=20261120_v4';}
            else{this.onerror=null;this.src='花間/Kakan的原.JPG?v=20261120_v4';}
        };
        zImg.src = 'Kakan的原.jpg?v=20261120_v4';
    }
    document.getElementById('zoomModal').classList.add('open');
}

// ★ 每日御神籤系統（右上角迷你膠囊按鈕 + 置中彈窗，完全不佔首頁主版面）
const OMIKUJI_SLIPS = [
    { key: "大吉", file: "御神籤_大吉", color: "#e11d48", weight: 14, hasReward: true },
    { key: "吉",   file: "御神籤_吉",   color: "#16a34a", weight: 16, hasReward: true },
    { key: "中吉", file: "御神籤_中吉", color: "#9333ea", weight: 18, hasReward: true },
    { key: "小吉", file: "御神籤_小吉", color: "#d97706", weight: 18, hasReward: true },
    { key: "末吉", file: "御神籤_末吉", color: "#0284c7", weight: 12, hasReward: false },
    { key: "末小吉", file: "御神籤_末小吉", color: "#ec4899", weight: 10, hasReward: false },
    { key: "平",   file: "御神籤_平",   color: "#64748b", weight: 7,  hasReward: false },
    { key: "小兇", file: "御神籤_小兇", color: "#ea580c", weight: 5,  hasReward: false }
];

const REWARD_TICKET_KEY = 'huajian_omikuji_box_tickets_v1';
const REWARD_GRANTED_DATE_KEY = 'huajian_omikuji_reward_granted_date_v1';

function getBoxResetTickets() {
    return Math.max(0, parseInt(localStorage.getItem(REWARD_TICKET_KEY) || '0', 10));
}

function grantDailyOmikujiRewardIfEligible(slip) {
    if (!slip || !slip.hasReward) return;
    const today = getTodayDateKey();
    if (localStorage.getItem(REWARD_GRANTED_DATE_KEY) === today) return;
    localStorage.setItem(REWARD_GRANTED_DATE_KEY, today);
    localStorage.setItem(REWARD_TICKET_KEY, String(getBoxResetTickets() + 1));
}

function getTodayDateKey() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function getTodayOmikujiRecord() {
    try {
        const raw = localStorage.getItem('huajian_daily_omikuji_v1');
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (parsed && parsed.date === getTodayDateKey() && parsed.slip) {
            return parsed.slip;
        }
    } catch (e) {}
    return null;
}

function saveTodayOmikujiRecord(slip) {
    try {
        localStorage.setItem('huajian_daily_omikuji_v1', JSON.stringify({
            date: getTodayDateKey(),
            slip: slip
        }));
        grantDailyOmikujiRewardIfEligible(slip);
    } catch (e) {}
}

function pickWeightedOmikuji() {
    const total = OMIKUJI_SLIPS.reduce((sum, item) => sum + item.weight, 0);
    let roll = Math.random() * total;
    for (const item of OMIKUJI_SLIPS) {
        if (roll < item.weight) return item;
        roll -= item.weight;
    }
    return OMIKUJI_SLIPS[0];
}

function mountTopbarOmikujiBtn() {
    if (document.getElementById('topbarOmikujiBtn')) return;
    const spacer = document.querySelector('#siteMenu .topbar .spacer');
    if (!spacer) return;
    spacer.innerHTML = `<button type="button" class="topbar-omikuji-btn has-unread" id="topbarOmikujiBtn" onclick="openOmikujiModal()">
        <span>⛩️</span><span id="topbarOmikujiText">每日一籤</span><span class="omikuji-dot" id="topbarOmikujiDot"></span>
    </button>`;
}

function updateTopbarOmikujiBtn() {
    mountTopbarOmikujiBtn();
    const btn = document.getElementById('topbarOmikujiBtn');
    const txt = document.getElementById('topbarOmikujiText');
    const dot = document.getElementById('topbarOmikujiDot');
    if (!btn || !txt) return;

    const todaySlip = getTodayOmikujiRecord();
    if (todaySlip) {
        txt.innerText = todaySlip.key;
        btn.style.borderColor = todaySlip.color;
        btn.style.color = todaySlip.color;
        btn.classList.remove('has-unread');
        if (dot) dot.style.display = 'none';
    } else {
        txt.innerText = '每日一籤';
        btn.style.borderColor = '#f0a8b4';
        btn.style.color = '#c76272';
        btn.classList.add('has-unread');
        if (dot) dot.style.display = 'inline-block';
    }
}

function openOmikujiModal() {
    renderOmikujiSection();
    document.getElementById('omikujiModal').classList.add('open');
}

function closeOmikujiModal() {
    document.getElementById('omikujiModal').classList.remove('open');
}

let isDrawingOmikuji = false;

function renderOmikujiSection() {
    updateTopbarOmikujiBtn();
    const stage = document.getElementById('omikujiStage');
    const sub = document.getElementById('omikujiSub');
    if (!stage) return;

    const todaySlip = getTodayOmikujiRecord();
    if (todaySlip) {
        const tickets = getBoxResetTickets();
        const isLucky = ["大吉", "中吉", "小吉", "吉"].includes(todaySlip.key);
        let rewardHtml = '';
        if (isLucky) {
            if (tickets > 0) {
                rewardHtml = `
                    <div class="omikuji-reward-box">
                        <div class="omikuji-reward-title">🎉 恭喜抽中【${todaySlip.key}】吉籤獎勵！</div>
                        <div class="omikuji-reward-desc">獲得「🎟️ 盲盒次數重置券 × ${tickets} 張」<br>可前往驚喜盲盒選擇任一系列增加 1 次抽取機會！</div>
                        <a href="box.html" class="omikuji-go-box-btn">🎁 前往驚喜盲盒使用 ＞</a>
                    </div>
                `;
            } else {
                rewardHtml = `
                    <div class="omikuji-reward-box" style="background:#f8fafc;border-color:#cbd5e1">
                        <div class="omikuji-reward-title" style="color:#475569">✅ 今日【${todaySlip.key}】吉籤獎勵已使用完畢</div>
                        <div class="omikuji-reward-desc" style="color:#64748b;margin-bottom:0">明天再來抽御神籤拿更多盲盒加抽機會吧！</div>
                    </div>
                `;
            }
        }
        sub.innerText = `✨ 今日（${getTodayDateKey()}）已求得神籤，點擊籤紙可放大 ✨`;
        const imgPath = `御神籤/${todaySlip.file}.jpg`;
        stage.innerHTML = `
            <div class="omikuji-result-wrap">
                <span class="omikuji-badge" style="background:${todaySlip.color}">🌸 今日運勢・${todaySlip.key} 🌸</span>
                <div class="omikuji-slip-box">
                    <img class="omikuji-slip-img" src="${imgPath}?v=20261123" alt="御神籤_${todaySlip.key}"
                        onclick="openZoom(this.src)"
                        onerror="if(!this.dataset.step){this.dataset.step=1;this.src='御神籤/${todaySlip.file}.JPG?v=20261123';}else if(this.dataset.step==1){this.dataset.step=2;this.src='御神籤/${todaySlip.file}.png?v=20261123';}else{this.onerror=null;this.src='御神籤/${todaySlip.file}.PNG?v=20261123';}">
                </div>
                ${rewardHtml}
                <div class="omikuji-done-note">🌙 今日抽籤已使用（1/1次），明天 00:00 自動重置</div>
            </div>
        `;
        return;
    }

    sub.innerText = `誠心搖一搖籤筒，看看今天（${getTodayDateKey()}）的公會運勢！（每日限抽 1 次）`;
    stage.innerHTML = `
        <div class="omikuji-stage">
            <div class="omikuji-tube-wrap" id="omikujiTubeWrap" onclick="drawDailyOmikuji()" title="點擊籤筒抽取今日御神籤">
                <div id="omikujiComicSlot"></div>
                <img class="omikuji-tube-img" src="御神籤/御神籤籤筒.jpg?v=20261123" alt="花間小憩御神籤籤筒"
                    onerror="if(!this.dataset.step){this.dataset.step=1;this.src='御神籤/御神籤籤筒.JPG?v=20261123';}else if(this.dataset.step==1){this.dataset.step=2;this.src='御神籤/御神籤籤筒.png?v=20261123';}else{this.onerror=null;this.src='御神籤/御神籤籤筒.PNG?v=20261123';}">
            </div>
            <button type="button" class="omikuji-btn" id="omikujiDrawBtn" onclick="drawDailyOmikuji()">
                🎋 搖動籤筒・抽取今日神籤
            </button>
        </div>
    `;
}

function drawDailyOmikuji() {
    if (isDrawingOmikuji || getTodayOmikujiRecord()) return;
    isDrawingOmikuji = true;

    const btn = document.getElementById('omikujiDrawBtn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = '🎋 誠心祈願搖籤中...';
    }
    const wrap = document.getElementById('omikujiTubeWrap');
    const slot = document.getElementById('omikujiComicSlot');
    if (slot) {
        slot.innerHTML = '<div class="omikuji-comic">🎵 喀啦喀啦～</div>';
    }
    if (wrap) {
        wrap.classList.remove('omikuji-shaking');
        void wrap.offsetWidth;
        wrap.classList.add('omikuji-shaking');
    }

    const chosen = pickWeightedOmikuji();
    setTimeout(() => {
        saveTodayOmikujiRecord(chosen);
        isDrawingOmikuji = false;
        renderOmikujiSection();
    }, 950);
}
function closeZoom(){
    document.getElementById('zoomModal').classList.remove('open');
}
function openGame(event){
    openEmbeddedGame(event, 'MeowMilk.html?v=20261123_v5', '#meow-milk', '🥛 喵喵乳糖挑戰');
}
function openGame1(event){
    openEmbeddedGame(event, 'HitMeow.html?v=20261123_v5', '#hit-meow', '🩴 暴打小菜雞');
}
let cachedSeriesConfig = null;

function syncMenuActiveState(){
    if (!window.HuajianMenu) return;
    if (cachedSeriesConfig) {
        window.HuajianMenu.renderSharedSubMenu(cachedSeriesConfig);
    } else {
        window.HuajianMenu.mountGlobalDrawer();
    }
}

function openEmbeddedGame(event, source, hash, title){
    if (event) event.preventDefault();
    document.getElementById('homeView').classList.add('hidden');
    document.getElementById('mainWrap').classList.add('game-active');
    document.body.classList.add('game-mode-active');
    const gameCard=document.getElementById('gameCard');
    gameCard.classList.add('open');
    const frame=document.getElementById('gameFrame');
    if (frame.getAttribute('src') !== source) frame.setAttribute('src',source);
    frame.title=title;
    document.getElementById('gameTitle').textContent=title;
    if (window.location.hash !== hash) history.replaceState(null,'',hash);
    syncMenuActiveState();
    toggleMenuIfOpen();
    window.scrollTo({top:0,behavior:'smooth'});
}
function showHome(event){
    if (event) event.preventDefault();
    document.getElementById('homeView').classList.remove('hidden');
    document.getElementById('mainWrap').classList.remove('game-active');
    document.body.classList.remove('game-mode-active');
    document.getElementById('gameCard').classList.remove('open');
    const frame=document.getElementById('gameFrame');
    if (frame) frame.removeAttribute('src');
    if (window.location.hash === '#meow-milk' || window.location.hash === '#hit-meow') {
        history.replaceState(null,'',window.location.pathname + window.location.search);
    }
    syncMenuActiveState();
    toggleMenuIfOpen();
    window.scrollTo({top:0,behavior:'smooth'});
}
function toggleMenuIfOpen(){
    const drawer=document.getElementById('drawer');
    if (drawer.classList.contains('open')) toggleMenu();
}

window.addEventListener('DOMContentLoaded', async function(){
    updateTopbarOmikujiBtn();
    if (window.location.hash === '#meow-milk') openGame();
    else if (window.location.hash === '#hit-meow') openGame1();
    const bg=document.getElementById('fxBg');
    for(let i=0;i<45;i++){
        const p=document.createElement('div');p.className='petal';
        const s=9+Math.random()*13;p.style.width=s+'px';p.style.height=(s*.75)+'px';
        p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(6+Math.random()*8)+'s';
        p.style.animationDelay=(-Math.random()*10)+'s';bg.appendChild(p);
    }
    for(let i=0;i<25;i++){
        const b=document.createElement('div');b.className='bubble';
        const s=20+Math.random()*45;b.style.width=s+'px';b.style.height=s+'px';
        b.style.left=(Math.random()*100)+'vw';b.style.animationDuration=(10+Math.random()*10)+'s';
        b.style.animationDelay=(-Math.random()*8)+'s';bg.appendChild(b);
    }
    if (window.HuajianMenu) {
        cachedSeriesConfig = await window.HuajianMenu.fetchAllSeries();
        window.HuajianMenu.renderSharedSubMenu(cachedSeriesConfig);
    }
});
</script>
