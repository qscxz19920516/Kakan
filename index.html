<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>花間小憩 - 首頁</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Rounded Mplus 1c",sans-serif}
body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative}
.bg-watermark{position:fixed;top:64px;left:0;right:0;bottom:0;z-index:0;pointer-events:none;background-image:url('百變.jpg'),url('百變.JPG'),url('花間/百變.jpg'),url('花間/百變.JPG');background-size:contain;background-position:center;background-repeat:no-repeat;opacity:.3}
.fx-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffe4ea 0%,#ffb3c6 50%,#ff8fa3 100%);border-radius:18px 0 18px 0;box-shadow:0 2px 6px rgba(255,158,181,.3);opacity:.85;animation:fall ease-in-out infinite}
.bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(135,206,250,.32));border:1.5px solid rgba(173,216,230,.65);box-shadow:0 2px 8px rgba(135,206,250,.2);animation:rise ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,240,242,.92);backdrop-filter:blur(8px);border-bottom:2px dashed #f2bec7;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.menu-btn{background:#fff;border:2px solid #f0a8b4;color:#c76272;font-size:1.3rem;width:42px;height:42px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(226,158,168,.15)}
.brand{font-size:1.25rem;font-weight:800;color:#c76272;letter-spacing:1.5px}
.spacer{width:42px}

.drawer-mask{display:none;position:fixed;inset:0;background:rgba(90,70,73,.45);z-index:99}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;left:-290px;width:280px;height:100%;background:#fff;z-index:100;transition:left .3s ease;box-shadow:4px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer.open{left:0}
.drawer-hd{padding:20px;background:linear-gradient(135deg,#ffe5e2,#fbdce6);display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #f2bec7}
.drawer-hd span{font-weight:800;color:#c76272;font-size:1.1rem}
.close-btn{background:#fff;border:none;color:#c76272;font-size:1.2rem;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800}
.drawer-list{list-style:none;padding:8px 0}
.drawer-list li a{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;text-decoration:none;color:#5a4649;font-weight:800;font-size:1.05rem;border-bottom:1px solid #f7e8ea;transition:.2s}
.drawer-list li a:hover,.drawer-list li a.current{background:#fff6f7;color:#c76272}
.arrow{color:#c76272;font-weight:800}
.sub-toggle{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:#5a4649;font-weight:800;font-size:1.05rem;border-bottom:1px solid #f7e8ea;cursor:pointer;transition:.2s}
.sub-toggle:hover{background:#fff6f7;color:#c76272}
.arrow{transition:transform .25s ease}
.arrow.rot{transform:rotate(90deg)}
.submenu{display:none;list-style:none;background:#fffafa}
.submenu.open{display:block}
.submenu li a{padding:14px 24px 14px 42px;font-size:.96rem;border-bottom:1px dashed #f7e8ea;color:#7a5c61}

.wrap{position:relative;z-index:1;max-width:960px;margin:30px auto;padding:0 16px}
.hero{background:rgba(255,255,255,.78);backdrop-filter:blur(4px);border-radius:28px;padding:42px 24px;text-align:center;box-shadow:0 8px 25px rgba(226,158,168,.15);border:2px solid #f9dfe3}
.hero h1{font-size:2rem;color:#c76272;margin-bottom:10px;text-shadow:1px 1px 0 #fff}
.hero p{color:#8c7075;font-size:1rem;margin-bottom:30px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;max-width:680px;margin:0 auto}
.portal{display:block;text-decoration:none;background:rgba(255,248,249,.86);border:2px dashed #f2bec7;border-radius:24px;padding:30px 20px;transition:.25s}
.portal:hover{transform:translateY(-4px);background:#fff;border-style:solid;box-shadow:0 8px 20px rgba(235,168,178,.22)}
.portal-icon{font-size:3rem;display:block;margin-bottom:10px}
.portal-title{font-size:1.25rem;font-weight:800;color:#c76272;margin-bottom:6px}
.portal-desc{font-size:.9rem;color:#947479}
</style>
</head>
<body>
<div class="bg-watermark"></div>
<div class="fx-bg" id="fxBg"></div>

<div class="topbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="brand">🌸 花間小憩 🌸</div>
    <div class="spacer"></div>
</div>

<div class="drawer-mask" id="mask" onclick="toggleMenu()"></div>
<nav class="drawer" id="drawer">
    <div class="drawer-hd">
        <span>🌸 花間小憩選單</span>
        <button class="close-btn" onclick="toggleMenu()">✕</button>
    </div>
    <ul class="drawer-list">
        <li><a href="index.html" class="current"><span>🏠 首頁</span><span class="arrow">&gt;</span></a></li>
        <li><a href="card.html"><span>🎴 小卡圖鑑</span><span class="arrow">&gt;</span></a></li>
        <li>
            <div class="sub-toggle" onclick="toggleSubMenu()"><span>🎁 驚喜盲盒</span><span class="arrow" id="subArrow">&gt;</span></div>
            <ul class="submenu" id="subMenu">
                <li><a href="box.html?job=花間 × 袋裝零食" onclick="goBox(event, '花間 × 袋裝零食')"><span>花間 × 袋裝零食</span><span class="arrow">&gt;</span></a></li>
                <li><a href="box.html?job=花間 × 飲品" onclick="goBox(event, '花間 × 飲品盒')"><span>花間 × 飲品盒</span><span class="arrow">&gt;</span></a></li>
                <li><a href="box.html?job=花間 × 童話反派" onclick="goBox(event, '花間 × 童話反派')"><span>花間 × 童話反派</span><span class="arrow">&gt;</span></a></li>
                <li><a href="box.html?job=花間 × 多巴胺女團" onclick="goBox(event, '花間 × 多巴胺女團')"><span>花間 × 多巴胺女團</span><span class="arrow">&gt;</span></a></li>
            </ul>
        </li>
    </ul>
</nav>

<div class="wrap">
    <div class="hero">
        <h1>✨ 歡迎來到花間小憩 ✨</h1>
        <p>點擊左上角選單或下方卡片，探索成員專屬小卡與驚喜盲盒！</p>
        <div class="cards">
            <a href="card.html" class="portal">
                <span class="portal-icon">🎴</span>
                <div class="portal-title">成員小卡圖鑑</div>
                <div class="portal-desc">查看全體 56 位成員專屬小卡與四大職業進度</div>
            </a>
            <a href="box.html" class="portal">
                <span class="portal-icon">🎁</span>
                <div class="portal-title">驚喜盲盒區</div>
                <div class="portal-desc">花間小憩專屬盲盒活動專區</div>
            </a>
        </div>
    </div>
</div>

<script>
function toggleMenu(){
    document.getElementById('drawer').classList.toggle('open');
    document.getElementById('mask').classList.toggle('open');
}
function toggleSubMenu(){
    document.getElementById('subMenu').classList.toggle('open');
    document.getElementById('subArrow').classList.toggle('rot');
}
function goBox(e, job){
    // 點擊後會直接透過網址跳轉至 box.html 對應職業
}

(function(){
    const bg=document.getElementById('fxBg');
    for(let i=0;i<45;i++){
        const p=document.createElement('div');p.className='petal';
        const s=9+Math.random()*13;p.style.width=s+'px';p.style.height=(s*.75)+'px';
        p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(6+Math.random()*8)+'s';
        p.style.animationDelay=(-Math.random()*10)+'s';bg.appendChild(p);
    }
    for(let i=0;i<25;i++){
        const b=document.createElement('div');b.className='bubble';
        const s=20+Math.random()*45;b.style.width=s+'px';b.style.height=s+'px';
        b.style.left=(Math.random()*100)+'vw';b.style.animationDuration=(10+Math.random()*10)+'s';
        b.style.animationDelay=(-Math.random()*8)+'s';bg.appendChild(b);
    }
})();
</script>
</body>
</html>
