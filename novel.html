<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>花間小憩 - 公會小說閱讀區</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Serif TC","Rounded Mplus 1c",sans-serif}
body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative;padding-bottom:75px;transition:background .25s,color .25s}
.fx-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffe4ea 0%,#ffb3c6 50%,#ff8fa3 100%);border-radius:18px 0 18px 0;box-shadow:0 2px 6px rgba(255,158,181,.3);opacity:.85;animation:fall ease-in-out infinite}
.bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(135,206,250,.32));border:1.5px solid rgba(173,216,230,.65);box-shadow:0 2px 8px rgba(135,206,250,.2);animation:rise ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.wrap{position:relative;z-index:1;max-width:860px;margin:20px auto;padding:0 16px}

/* 頂部標題橫幅 */
.novel-hero{background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:26px;padding:20px 18px;box-shadow:0 8px 25px rgba(226,158,168,.15);border:2px solid #f9dfe3;margin-bottom:14px;text-align:center;position:relative}
.novel-badge{display:inline-flex;align-items:center;gap:6px;background:#fff0f3;border:1.5px solid #f2bec7;color:#c76272;font-size:.78rem;font-weight:900;padding:3px 12px;border-radius:999px;margin-bottom:6px}
.novel-hero h1{font-size:1.55rem;font-weight:900;color:#c76272;margin-bottom:4px}
.novel-sub{font-size:.84rem;color:#8c7075;font-weight:700}
.sync-btn{position:absolute;top:16px;right:16px;background:#fff;border:1.5px solid #e6c5ca;color:#8c7075;width:36px;height:36px;border-radius:50%;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.sync-btn:hover{border-color:#c76272;color:#c76272;transform:rotate(90deg)}

/* 繼續閱讀書籤提示列 */
.bookmark-bar{display:none;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #f59e0b;border-radius:20px;padding:10px 14px;margin-bottom:14px;box-shadow:0 4px 12px rgba(245,158,11,.15);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bookmark-bar.show{display:flex}
.bm-text{font-size:.84rem;font-weight:800;color:#92400e;text-align:left;line-height:1.4}
.bm-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;padding:7px 14px;border-radius:15px;font-size:.8rem;font-weight:900;cursor:pointer;white-space:nowrap;box-shadow:0 3px 8px rgba(217,119,6,.25)}
.bm-btn:hover{filter:brightness(1.06)}

/* 作品系列選擇列與折疊目錄 */
.catalog-card{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:24px;padding:16px 18px;box-shadow:0 6px 20px rgba(226,158,168,.13);border:2px solid #f9dfe3;margin-bottom:16px}
.book-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.book-tab{padding:8px 16px;border-radius:18px;border:2px solid #f0a8b4;background:#fff;color:#7a5c61;font-size:.88rem;font-weight:900;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
.book-tab:hover{border-color:#c76272;color:#c76272;transform:translateY(-1px)}
.book-tab.active{background:linear-gradient(135deg,#ff8fa3,#e26d82);border-color:#e26d82;color:#fff;box-shadow:0 4px 12px rgba(226,109,130,.28)}

.toc-header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;background:#fff8f9;border:1.5px solid #f7d7dc;border-radius:16px;cursor:pointer;user-select:none}
.toc-title{font-size:.92rem;font-weight:900;color:#c76272;display:flex;align-items:center;gap:6px}
.toc-toggle-pill{font-size:.78rem;font-weight:800;color:#8c7075;background:#fff;border:1px solid #f2bec7;padding:2px 10px;border-radius:12px}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px;margin-top:12px}
.chapter-grid.collapsed{display:none}
.chap-btn{text-align:left;padding:10px 14px;border-radius:14px;border:1.5px solid #f2bec7;background:#fff9fa;color:#5a4649;font-size:.86rem;font-weight:800;cursor:pointer;transition:.18s;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chap-btn:hover{background:#fff;border-color:#e26d82;color:#c76272;transform:translateY(-1px)}
.chap-btn.active{background:linear-gradient(135deg,#fff0f3,#ffe4ea);border-color:#e26d82;color:#c76272;font-weight:900;box-shadow:0 3px 10px rgba(226,109,130,.15)}
.chap-btn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chap-read-tag{font-size:.7rem;padding:1px 7px;border-radius:999px;background:#edf9f0;color:#1e8e3e;border:1px solid #bfe6c9;flex-shrink:0}

/* 閱讀器控制列（字級 + 底色） */
.reader-toolbar{background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-radius:22px;padding:12px 16px;box-shadow:0 6px 18px rgba(226,158,168,.12);border:2px solid #f9dfe3;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;scroll-margin-top:72px}
.tool-group{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tool-label{font-size:.78rem;font-weight:900;color:#8c7075}
.ctrl-pill{padding:5px 11px;border-radius:12px;border:1.5px solid #f0a8b4;background:#fff;color:#5a4649;font-size:.8rem;font-weight:800;cursor:pointer;transition:.15s}
.ctrl-pill:hover{border-color:#c76272;color:#c76272}
.ctrl-pill.active{background:#c76272;border-color:#c76272;color:#fff}
.theme-swatch{width:26px;height:26px;border-radius:50%;border:2px solid #d4b8bd;cursor:pointer;transition:transform .15s;display:inline-flex;align-items:center;justify-content:center;font-size:.72rem}
.theme-swatch.active{border-color:#c76272;transform:scale(1.12);box-shadow:0 0 0 2px rgba(199,98,114,.28)}

/* 文章閱讀主舞台 */
.reader-card{background:#ffffff;border-radius:28px;padding:28px 26px 32px;box-shadow:0 10px 28px rgba(226,158,168,.16);border:2px solid #f9dfe3;transition:background .25s,color .25s,border-color .25s;scroll-margin-top:72px}
.reader-book-tag{display:inline-block;font-size:.78rem;font-weight:900;color:#c76272;background:#fff0f3;border:1px solid #f2bec7;padding:3px 12px;border-radius:999px;margin-bottom:8px}
.reader-chap-title{font-size:1.42rem;font-weight:900;color:#4a373a;margin-bottom:8px;line-height:1.4}
.reader-meta{font-size:.8rem;color:#947479;font-weight:700;padding-bottom:14px;margin-bottom:20px;border-bottom:2px dashed #f2bec7;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}

.novel-content{font-size:1.08rem;line-height:1.95;color:#3f3134;letter-spacing:.03em;word-break:break-word}
.novel-content p{margin-bottom:1.15em;text-indent:2em}
.novel-content p.no-indent{text-indent:0}
.novel-content p.scene-break{text-indent:0;text-align:center;color:#c76272;font-weight:900;letter-spacing:4px;margin:1.5em 0}

/* 底部上一章／下一章導覽列 */
.chapter-nav-bar{margin-top:26px;padding-top:18px;border-top:2px dashed #f2bec7;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.nav-chap-btn{padding:11px 14px;border-radius:16px;border:2px solid #f0a8b4;background:#fff8f9;color:#c76272;font-size:.88rem;font-weight:900;cursor:pointer;transition:.18s;text-align:center}
.nav-chap-btn:hover:not(:disabled){background:#c76272;border-color:#c76272;color:#fff;transform:translateY(-1px)}
.nav-chap-btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.chap-select{padding:10px 12px;border-radius:14px;border:2px solid #f0a8b4;background:#fff;color:#5a4649;font-size:.86rem;font-weight:800;max-width:210px;outline:none;cursor:pointer}

/* 閱讀底色主題：護眼米黃 (sepia) 與 夜間深色 (dark) */
body.theme-sepia .reader-card{background:#fbf4e4;border-color:#e6d5b8}
body.theme-sepia .reader-chap-title{color:#4b3b28}
body.theme-sepia .novel-content{color:#433422}
body.theme-sepia .reader-meta,body.theme-sepia .chapter-nav-bar{border-color:#e2cfa9}

body.theme-dark{background:linear-gradient(180deg,#1a1820 0%,#211e29 100%);color:#e2dce8}
body.theme-dark .novel-hero,body.theme-dark .catalog-card,body.theme-dark .reader-toolbar{background:rgba(36,33,46,.95);border-color:#3d3752;color:#e2dce8}
body.theme-dark .novel-hero h1,body.theme-dark .toc-title{color:#f497aa}
body.theme-dark .novel-sub,body.theme-dark .tool-label,body.theme-dark .reader-meta{color:#a79eb5}
body.theme-dark .toc-header,body.theme-dark .chap-btn,body.theme-dark .ctrl-pill,body.theme-dark .book-tab,body.theme-dark .nav-chap-btn,body.theme-dark .chap-select{background:#2a2636;border-color:#453e5c;color:#e2dce8}
body.theme-dark .chap-btn.active,body.theme-dark .book-tab.active,body.theme-dark .ctrl-pill.active{background:#c76272;border-color:#c76272;color:#fff}
body.theme-dark .reader-card{background:#24212e;border-color:#3d3752}
body.theme-dark .reader-chap-title{color:#f7eef2}
body.theme-dark .novel-content{color:#ddd6e6}
body.theme-dark .reader-meta,body.theme-dark .chapter-nav-bar{border-color:#3d3752}

.state-box{text-align:center;padding:38px 16px;color:#8c7075;font-weight:800;font-size:.95rem;line-height:1.7}

@media(max-width:600px){
    .reader-card{padding:22px 16px 26px;border-radius:22px}
    .reader-chap-title{font-size:1.22rem}
    .chapter-nav-bar{grid-template-columns:1fr 1fr}
    .chap-select{grid-column:1/-1;max-width:100%;order:-1}
}
</style>

<div class="wrap">

<script src="menu-sync.js?v=20261126_v2"></script>
<script>
const NOVEL_OWNER = "qscxz19920516";
const NOVEL_REPO = "Kakan";
const NOVEL_ROOT = "小說";
const NOVEL_CACHE_KEY = "huajian_novel_tree_v1_" + NOVEL_OWNER + "_" + NOVEL_REPO;
const BOOKMARK_KEY = "huajian_novel_bookmark_v1";
const READ_HISTORY_KEY = "huajian_novel_read_chapters_v1";
const PREF_FONT_KEY = "huajian_novel_font_size_v1";
const PREF_THEME_KEY = "huajian_novel_theme_v1";

let novelBooks = [];
let activeBookIdx = 0;
let activeChapIdx = 0;
let tocCollapsed = false;

const CN_NUM_MAP = { "零":0, "〇":0, "一":1, "二":2, "兩":2, "三":3, "四":4, "五":5, "六":6, "七":7, "八":8, "九":9 };
function parseChineseNumber(str) {
    if (!str) return null;
    if (/^\d+$/.test(str)) return parseInt(str, 10);
    let total = 0;
    let current = 0;
    for (const ch of str) {
        if (ch === "十") {
            total += (current === 0 ? 1 : current) * 10;
            current = 0;
        } else if (ch === "百") {
            total += (current === 0 ? 1 : current) * 100;
            current = 0;
        } else if (ch in CN_NUM_MAP) {
            current = CN_NUM_MAP[ch];
        }
    }
    return total + current;
}

function extractChapterOrder(title) {
    const m = title.match(/^第([零〇一二兩三四五六七八九十百\d]+)[章回話節]/);
    if (m) {
        const n = parseChineseNumber(m[1]);
        if (n !== null) return n;
    }
    const numPrefix = title.match(/^(\d+)/);
    if (numPrefix) return parseInt(numPrefix[1], 10);
    return 999999;
}

function compareChapters(a, b) {
    const oa = extractChapterOrder(a.title);
    const ob = extractChapterOrder(b.title);
    if (oa !== ob) return oa - ob;
    return a.title.localeCompare(b.title, "zh-Hant", { numeric: true });
}

function parseNovelsFromTree(tree) {
    if (!Array.isArray(tree) || tree.length === 0) return [];
    const bookMap = {};
    tree.forEach(item => {
        if (item.type !== "blob") return;
        if (!/\.(txt|md)$/i.test(item.path)) return;
        const parts = item.path.split("/");
        if (parts[0] !== NOVEL_ROOT || parts.length < 2) return;

        const fileName = parts[parts.length - 1];
        const chapTitle = fileName.replace(/\.(txt|md)$/i, "").trim();
        const bookTitle = parts.length >= 3 ? parts[1] : "精選短篇集";

        if (!bookMap[bookTitle]) bookMap[bookTitle] = [];
        bookMap[bookTitle].push({ title: chapTitle, path: item.path });
    });

    return Object.keys(bookMap)
        .sort((a, b) => a.localeCompare(b, "zh-Hant", { numeric: true }))
        .map(bookTitle => ({
            bookTitle,
            chapters: bookMap[bookTitle].sort(compareChapters)
        }));
}

async function fetchNovelCatalog(bypassCache = false) {
    if (!bypassCache) {
        try {
            const cached = sessionStorage.getItem(NOVEL_CACHE_KEY);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
        } catch (e) {}
    }

    if (window.HuajianMenu && typeof window.HuajianMenu.fetchRepoTree === 'function') {
        const sharedTree = await window.HuajianMenu.fetchRepoTree(bypassCache);
        const booksFromShared = parseNovelsFromTree(sharedTree);
        if (booksFromShared.length > 0) {
            try { sessionStorage.setItem(NOVEL_CACHE_KEY, JSON.stringify(booksFromShared)); } catch (e) {}
            return booksFromShared;
        }
    }

    const branches = ["main", "master"];
    try {
        const repoRes = await fetch(`https://api.github.com/repos/${NOVEL_OWNER}/${NOVEL_REPO}?_=${Date.now()}`);
        if (repoRes.ok) {
            const info = await repoRes.json();
            if (info && info.default_branch && !branches.includes(info.default_branch)) {
                branches.unshift(info.default_branch);
            }
        }
    } catch (e) {}

    for (const br of branches) {
        try {
            const branchRes = await fetch(`https://api.github.com/repos/${NOVEL_OWNER}/${NOVEL_REPO}/branches/${br}?_=${Date.now()}`);
            let treeSha = br;
            if (branchRes.ok) {
                const bData = await branchRes.json();
                if (bData && bData.commit && bData.commit.commit && bData.commit.commit.tree) {
                    treeSha = bData.commit.commit.tree.sha;
                }
            }

            const res = await fetch(`https://api.github.com/repos/${NOVEL_OWNER}/${NOVEL_REPO}/git/trees/${treeSha}?recursive=1&_=${Date.now()}`);
            if (!res.ok) continue;
            const data = await res.json();
            const books = parseNovelsFromTree(data && data.tree);

            if (books.length > 0) {
                try { sessionStorage.setItem(NOVEL_CACHE_KEY, JSON.stringify(books)); } catch (e) {}
                return books;
            }
        } catch (e) {}
    }
    return [];
}

function getReadSet() {
    try {
        return new Set(JSON.parse(localStorage.getItem(READ_HISTORY_KEY) || "[]"));
    } catch (e) {
        return new Set();
    }
}

function markChapterRead(path) {
    try {
        const set = getReadSet();
        set.add(path);
        localStorage.setItem(READ_HISTORY_KEY, JSON.stringify(Array.from(set)));
    } catch (e) {}
}

function saveBookmark(bookTitle, chapTitle, path) {
    try {
        localStorage.setItem(BOOKMARK_KEY, JSON.stringify({ bookTitle, chapTitle, path }));
    } catch (e) {}
}

function checkBookmarkBanner() {
    const bar = document.getElementById("bookmarkBar");
    const txt = document.getElementById("bookmarkText");
    const btn = document.getElementById("bookmarkResumeBtn");
    if (!bar || !txt || !btn) return;
    try {
        const raw = localStorage.getItem(BOOKMARK_KEY);
        if (!raw) return;
        const bm = JSON.parse(raw);
        if (!bm || !bm.path) return;
        const bIdx = novelBooks.findIndex(b => b.bookTitle === bm.bookTitle);
        if (bIdx === -1) return;
        const cIdx = novelBooks[bIdx].chapters.findIndex(c => c.path === bm.path);
        if (cIdx === -1) return;

        txt.innerHTML = `🔖 上次讀到：《${bm.bookTitle}》<b>${bm.chapTitle}</b>`;
        bar.classList.add("show");
        btn.onclick = () => {
            bar.classList.remove("show");
            openChapter(bIdx, cIdx, true);
        };
    } catch (e) {}
}

function toggleChapterGrid() {
    tocCollapsed = !tocCollapsed;
    const grid = document.getElementById("chapterGrid");
    const pill = document.getElementById("tocTogglePill");
    if (grid) grid.classList.toggle("collapsed", tocCollapsed);
    if (pill) pill.textContent = tocCollapsed ? "展開目錄 ▼" : "收合目錄 ▲";
}

function renderCatalog() {
    const card = document.getElementById("catalogCard");
    const tabsEl = document.getElementById("bookTabs");
    const tocTitle = document.getElementById("tocTitle");
    const gridEl = document.getElementById("chapterGrid");
    if (!card || !novelBooks.length) return;

    card.style.display = "block";
    tabsEl.innerHTML = novelBooks.map((b, idx) => {
        const act = idx === activeBookIdx ? " active" : "";
        return `<button type="button" class="book-tab${act}" onclick="selectBook(${idx})">📘 ${b.bookTitle} (${b.chapters.length}章)</button>`;
    }).join("");

    const curBook = novelBooks[activeBookIdx];
    tocTitle.textContent = `📖 ${curBook.bookTitle}・章節目錄（共 ${curBook.chapters.length} 章）`;
    const readSet = getReadSet();

    gridEl.innerHTML = curBook.chapters.map((ch, cIdx) => {
        const act = cIdx === activeChapIdx ? " active" : "";
        const readTag = readSet.has(ch.path) ? `<span class="chap-read-tag">已讀</span>` : "";
        return `<button type="button" class="chap-btn${act}" onclick="openChapter(${activeBookIdx}, ${cIdx}, true)">
            <span class="chap-btn-label">${ch.title}</span>
            ${readTag}
        </button>`;
    }).join("");
}

function selectBook(bIdx) {
    activeBookIdx = bIdx;
    openChapter(bIdx, 0, false);
}

function formatNovelParagraphs(rawText) {
    const cleaned = rawText.replace(/^﻿/, "").replace(/
/g, "
");
    const lines = cleaned.split("
");
    let html = "";
    for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;
        if (/^[-—=*~＊・]{3,}$/.test(trimmed)) {
            html += `<p class="scene-break">${escapeHtml(trimmed)}</p>`;
        } else if (/^[「『（(【]/.test(trimmed)) {
            html += `<p class="no-indent">${escapeHtml(trimmed)}</p>`;
        } else {
            html += `<p>${escapeHtml(trimmed)}</p>`;
        }
    }
    return html || `<p class="no-indent">（本章尚無文字內容）</p>`;
}

function escapeHtml(str) {
    return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

async function fetchChapterText(relPath) {
    const encodedPath = relPath.split("/").map(encodeURIComponent).join("/");
    const urls = [
        `${encodedPath}?v=${Date.now()}`,
        `https://raw.githubusercontent.com/${NOVEL_OWNER}/${NOVEL_REPO}/main/${encodedPath}`,
        `https://raw.githubusercontent.com/${NOVEL_OWNER}/${NOVEL_REPO}/master/${encodedPath}`
    ];
    for (const url of urls) {
        try {
            const res = await fetch(url);
            if (res.ok) return await res.text();
        } catch (e) {}
    }
    throw new Error("無法讀取章節檔案");
}

function scrollToChapterTop() {
    const target = document.getElementById("readerToolbar") || document.getElementById("readerCard");
    if (!target) return;
    requestAnimationFrame(() => {
        const topbar = document.querySelector("#siteMenu .topbar");
        const offset = (topbar ? topbar.offsetHeight : 56) + 12;
        const targetY = Math.max(0, window.scrollY + target.getBoundingClientRect().top - offset);
        window.scrollTo({ top: targetY, behavior: "smooth" });
    });
}

async function openChapter(bIdx, cIdx, shouldScroll = true) {
    activeBookIdx = bIdx;
    activeChapIdx = cIdx;
    const book = novelBooks[bIdx];
    const chap = book.chapters[cIdx];

    markChapterRead(chap.path);
    saveBookmark(book.bookTitle, chap.title, chap.path);
    renderCatalog();

    const toolbar = document.getElementById("readerToolbar");
    const reader = document.getElementById("readerCard");
    if (toolbar) toolbar.style.display = "flex";
    reader.innerHTML = `<div class="state-box">📖 正在載入「${escapeHtml(chap.title)}」...</div>`;

    try {
        const rawText = await fetchChapterText(chap.path);
        const charCount = rawText.replace(/\s+/g, "").length;
        const hasPrev = cIdx > 0;
        const hasNext = cIdx < book.chapters.length - 1;
        const selectOptions = book.chapters.map((c, idx) =>
            `<option value="${idx}"${idx === cIdx ? " selected" : ""}>${escapeHtml(c.title)}</option>`
        ).join("");

        reader.innerHTML = `
            <div class="reader-book-tag">📘 ${escapeHtml(book.bookTitle)}</div>
            <h2 class="reader-chap-title">${escapeHtml(chap.title)}</h2>
            <div class="reader-meta">
                <span>第 ${cIdx + 1} / ${book.chapters.length} 章</span>
                <span>約 ${charCount.toLocaleString()} 字</span>
            </div>
            <div class="novel-content" id="novelContentBody">${formatNovelParagraphs(rawText)}</div>
            <div class="chapter-nav-bar">
                <button type="button" class="nav-chap-btn" ${hasPrev ? "" : "disabled"} onclick="openChapter(${bIdx}, ${cIdx - 1}, true)">⬅ 上一章</button>
                <select class="chap-select" aria-label="快速跳轉章節" onchange="openChapter(${bIdx}, Number(this.value), true)">${selectOptions}</select>
                <button type="button" class="nav-chap-btn" ${hasNext ? "" : "disabled"} onclick="openChapter(${bIdx}, ${cIdx + 1}, true)">下一章 ➡</button>
            </div>
        `;
        applySavedReaderPrefs();
        if (shouldScroll) {
            scrollToChapterTop();
        }
    } catch (err) {
        reader.innerHTML = `<div class="state-box">⚠️ 章節載入失敗，請確認檔案是否存在於 <code>${escapeHtml(chap.path)}</code> 或稍後重試。</div>`;
        if (shouldScroll) {
            scrollToChapterTop();
        }
    }
}

function setFontSize(size) {
    localStorage.setItem(PREF_FONT_KEY, size);
    const bodyEl = document.getElementById("novelContentBody");
    if (bodyEl) bodyEl.style.fontSize = size;
    document.querySelectorAll("#readerToolbar [data-size]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.size === size);
    });
}

function setReaderTheme(theme) {
    localStorage.setItem(PREF_THEME_KEY, theme);
    document.body.classList.remove("theme-sepia", "theme-dark");
    if (theme === "sepia") document.body.classList.add("theme-sepia");
    if (theme === "dark") document.body.classList.add("theme-dark");
    document.querySelectorAll("#readerToolbar [data-theme]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.theme === theme);
    });
}

function applySavedReaderPrefs() {
    const savedSize = localStorage.getItem(PREF_FONT_KEY) || "1.08rem";
    const savedTheme = localStorage.getItem(PREF_THEME_KEY) || "light";
    setFontSize(savedSize);
    setReaderTheme(savedTheme);
}

async function initNovels(bypassCache = false) {
    const syncBtn = document.getElementById("syncNovelBtn");
    const subEl = document.getElementById("novelHeroSub");
    const reader = document.getElementById("readerCard");
    if (syncBtn) syncBtn.textContent = "⏳";

    try {
        novelBooks = await fetchNovelCatalog(bypassCache);
        if (!novelBooks.length) {
            if (subEl) subEl.textContent = "目前尚未建立「小說/」資料夾或章節檔案";
            reader.innerHTML = `
                <div class="state-box">
                    🌸 書庫目前還是空的喔！<br>
                    只要在 GitHub 根目錄建立 <code>小說/作品名稱/第一章：標題.txt</code>，<br>
                    重新整理後就會自動出現在這裡囉！
                </div>
            `;
            return;
        }

        const totalChaps = novelBooks.reduce((sum, b) => sum + b.chapters.length, 0);
        if (subEl) subEl.textContent = `共收錄 ${novelBooks.length} 部作品・合計 ${totalChaps} 章（點擊章節即可線上閱讀）`;

        const urlParams = new URLSearchParams(window.location.search);
        const targetBook = urlParams.get("book");
        const targetChap = urlParams.get("chap");
        let startBook = 0;
        let startChap = 0;
        if (targetBook) {
            const foundB = novelBooks.findIndex(b => b.bookTitle.includes(targetBook));
            if (foundB !== -1) {
                startBook = foundB;
                if (targetChap) {
                    const foundC = novelBooks[foundB].chapters.findIndex(c => c.title.includes(targetChap));
                    if (foundC !== -1) startChap = foundC;
                }
            }
        }

        checkBookmarkBanner();
        await openChapter(startBook, startChap, false);
    } finally {
        if (syncBtn) syncBtn.textContent = "🔄";
    }
}

window.addEventListener("DOMContentLoaded", async function() {
    const bg = document.getElementById("fxBg");
    if (bg && bg.children.length === 0) {
        for(let i=0;i<45;i++){ const p=document.createElement("div");p.className="petal"; const s=9+Math.random()*13;p.style.width=s+"px";p.style.height=(s*.75)+"px"; p.style.left=(Math.random()*100)+"vw";p.style.animationDuration=(6+Math.random()*8)+"s"; p.style.animationDelay=(-Math.random()*10)+"s";bg.appendChild(p); }
        for(let i=0;i<25;i++){ const b=document.createElement("div");b.className="bubble"; const s=20+Math.random()*45;b.style.width=s+"px";b.style.height=s+"px"; b.style.left=(Math.random()*100)+"vw";b.style.animationDuration=(10+Math.random()*10)+"s"; b.style.animationDelay=(-Math.random()*8)+"s";bg.appendChild(b); }
    }

    applySavedReaderPrefs();

    if (window.HuajianMenu) {
        const cfg = await window.HuajianMenu.fetchAllSeries();
        window.HuajianMenu.renderSharedSubMenu(cfg);
    }
    await initNovels(false);
});
</script>
