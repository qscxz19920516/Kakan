<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>花間小憩 - 驚喜盲盒</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Rounded Mplus 1c",sans-serif}
body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative;padding-bottom:65px}
.fx-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffe4ea 0%,#ffb3c6 50%,#ff8fa3 100%);border-radius:18px 0 18px 0;box-shadow:0 2px 6px rgba(255,158,181,.3);opacity:.85;animation:fall ease-in-out infinite}
.bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(135,206,250,.32));border:1.5px solid rgba(173,216,230,.65);box-shadow:0 2px 8px rgba(135,206,250,.2);animation:rise ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.topbar{position:sticky;top:0;z-index:50;background:rgba(255,240,242,.92);backdrop-filter:blur(8px);border-bottom:2px dashed #f2bec7;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.menu-btn{background:#fff;border:2px solid #f0a8b4;color:#c76272;font-size:1.3rem;width:42px;height:42px;border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(226,158,168,.15)}
.brand{font-size:1.25rem;font-weight:800;color:#c76272;letter-spacing:1.5px}
.spacer{width:42px}

.drawer-mask{display:none;position:fixed;inset:0;background:rgba(90,70,73,.45);z-index:99}
.drawer-mask.open{display:block}
.drawer{position:fixed;top:0;left:-290px;width:280px;height:100%;background:#fff;z-index:100;transition:left .3s ease;box-shadow:4px 0 20px rgba(0,0,0,.12);display:flex;flex-direction:column}
.drawer.open{left:0}
.drawer-hd{padding:20px;background:linear-gradient(135deg,#ffe5e2,#fbdce6);display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #f2bec7;flex-shrink:0}
.drawer-hd span{font-weight:800;color:#c76272;font-size:1.1rem}
.close-btn{background:#fff;border:none;color:#c76272;font-size:1.2rem;width:34px;height:34px;border-radius:50%;cursor:pointer;font-weight:800}
.drawer-list{list-style:none;padding:8px 0 30px;overflow-y:auto;flex:1}
.drawer-list li a{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;text-decoration:none;color:#5a4649;font-weight:800;font-size:1.05rem;border-bottom:1px solid #f7e8ea;transition:.2s}
.drawer-list li a:hover,.drawer-list li a.current{background:#fff6f7;color:#c76272}
.arrow{color:#c76272;font-weight:800;transition:transform .25s ease}
.sub-toggle{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;color:#5a4649;font-weight:800;font-size:1.05rem;border-bottom:1px solid #f7e8ea;cursor:pointer;transition:.2s}
.sub-toggle:hover{background:#fff6f7;color:#c76272}
.arrow.rot{transform:rotate(90deg)}
.submenu{display:none;list-style:none;background:#fffafa}
.submenu.open{display:block}
.submenu li a{padding:14px 20px 14px 36px;font-size:.96rem;border-bottom:1px dashed #f7e8ea;color:#7a5c61;position:relative;gap:8px}
.submenu li a.active-series{
    background:linear-gradient(90deg,var(--series-soft,#fff0f3) 0%,#fff 100%);
    color:var(--series-color,#c76272);
    font-weight:900;
    border-left:5px solid var(--series-color,#c76272);
    padding-left:31px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
.active-pill{
    font-size:.7rem;
    font-weight:800;
    color:#fff;
    background:var(--series-color,#c76272);
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:.5px;
    flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.wrap{position:relative;z-index:1;max-width:680px;margin:20px auto;padding:0 16px}

/* 當前盲盒系列大橫幅 + 快速切換系列小按鈕 */
.active-series-banner{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:24px;padding:14px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(226,158,168,.14);border:2px solid #f39c12;display:flex;align-items:center;justify-content:space-between;gap:12px}
.asb-info{text-align:left;min-width:0}
.asb-sub{font-size:.74rem;font-weight:800;letter-spacing:1px;color:#f39c12;margin-bottom:2px}
.asb-title{font-size:1.2rem;font-weight:900;color:#5a4649;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asb-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.asb-switch-btn{background:#fff7f8;border:2px solid #f0a8b4;color:#c76272;padding:8px 14px;border-radius:18px;font-size:.84rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.2s;box-shadow:0 2px 6px rgba(226,158,168,.15)}
.asb-switch-btn:hover{background:#c76272;border-color:#c76272;color:#fff;transform:translateY(-1px)}
.asb-sync-btn{background:#fff;border:1.5px solid #e6c5ca;color:#8c7075;width:36px;height:36px;border-radius:50%;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.asb-sync-btn:hover{border-color:#c76272;color:#c76272;transform:rotate(90deg)}

.stage-card{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:28px;padding:26px 20px;box-shadow:0 8px 25px rgba(226,158,168,.16);border:2px solid #f9dfe3;text-align:center;position:relative;overflow:hidden}
.series-tag{font-size:.82rem;font-weight:800;letter-spacing:1px;margin-bottom:4px}
.stage-title{font-size:1.45rem;font-weight:800;color:#5a4649;margin-bottom:20px}

/* 6格盲盒網格 */
.box-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.box-item{cursor:pointer;transition:.25s;padding:10px 6px;border-radius:18px;background:#fff9fa;border:2px solid transparent}
.box-item:hover{transform:translateY(-5px);border-color:#f2bec7;background:#fff}
.mini-box{width:82px;height:96px;margin:0 auto 8px;border-radius:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 6px 12px rgba(0,0,0,.12)}
.mini-box::before{content:"";position:absolute;top:22px;left:0;right:0;height:6px;background:rgba(255,255,255,.45);border-top:1px dashed #fff;border-bottom:1px dashed #fff}
.q-circle{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;margin-top:12px}
.no-pill{font-size:.65rem;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:8px;margin-top:4px;font-weight:700}
.pick-lbl{font-size:.85rem;font-weight:800;color:#7a5c61}
.hint-banner{background:#fff8f0;border:1.5px dashed #f5cba7;color:#b9770e;padding:12px;border-radius:16px;font-size:.88rem;font-weight:700}

/* 單盒搖晃與拆封區 */
.big-box-wrap{padding:15px 0 20px}
.big-box{width:170px;height:200px;margin:0 auto;border-radius:24px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 24px rgba(0,0,0,.15);transition:.2s}
.tear-strip{position:absolute;top:44px;left:-4px;right:-4px;height:14px;background:#ff4d6d;border-top:2px dashed #fff;border-bottom:2px dashed #fff;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;color:#fff;font-size:.7rem;font-weight:900;border-radius:4px}
.big-q{width:76px;height:76px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;margin-top:24px;box-shadow:inset 0 2px 6px rgba(0,0,0,.08)}
.sound-bubble{background:#ffe066;color:#5a4649;padding:6px 16px;border-radius:20px;font-size:1.15rem;font-weight:900;border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.12);animation:pop .25s ease}
@keyframes pop{0%{transform:scale(.5)}80%{transform:scale(1.1)}100%{transform:scale(1)}}
.shaking{animation:shake .45s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(12deg) scale(1.05)}60%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}}

.clue-box{background:#fff8f9;border:1.5px solid #f7d7dc;border-radius:16px;padding:12px 16px;margin:14px 0 20px;font-size:.9rem;font-weight:700;color:#7a5c61;min-height:48px;display:flex;align-items:center;justify-content:center}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-shake{padding:14px;border-radius:18px;border:2px solid #f39c12;background:#fffdf5;color:#d68910;font-size:1rem;font-weight:800;cursor:pointer;transition:.2s}
.btn-shake:disabled{opacity:.5;cursor:not-allowed}
.btn-open{padding:14px;border-radius:18px;border:none;color:#fff;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.15);transition:.2s}
.btn-open:hover,.btn-shake:not(:disabled):hover{transform:translateY(-2px)}

/* 揭曉結果區 */
.rarity-pill{display:inline-block;padding:4px 16px;border-radius:20px;font-size:.82rem;font-weight:900;color:#fff;margin-bottom:14px;letter-spacing:1px}
.result-img-box{width:230px;height:230px;margin:0 auto 14px;border-radius:22px;background:#fff9fa;border:3px solid #f9dfe3;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 20px rgba(226,158,168,.2)}
.result-img-box img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;transition:transform .2s}
.result-img-box img:hover{transform:scale(1.04)}
.result-name{font-size:1.6rem;font-weight:900;color:#c76272;margin-bottom:4px}
.result-quote{font-size:.9rem;color:#8c7075;margin-bottom:20px;font-weight:600}
.confetti{position:absolute;width:10px;height:10px;top:-10px;animation:cfall 2.2s ease-out forwards}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(460px) rotate(720deg);opacity:0}}
.quota-bar{background:#fff8f9;border:2px dashed #f2bec7;color:#c76272;padding:8px 18px;border-radius:20px;font-weight:800;font-size:.92rem;margin-bottom:16px;text-align:center;box-shadow:0 3px 8px rgba(226,158,168,.1)}

/* 右下角浮動圖鑑按鈕與收集冊彈窗 */
.dex-fab{position:fixed;right:20px;bottom:22px;z-index:80;background:linear-gradient(135deg,#ff9a9e,#f68084);color:#fff;border:2px solid #fff;padding:12px 18px;border-radius:30px;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 6px 18px rgba(246,128,132,.4);display:flex;align-items:center;gap:6px;transition:.25s}
.dex-fab:hover{transform:translateY(-3px) scale(1.03)}
.dex-modal{display:none;position:fixed;inset:0;background:rgba(90,70,73,.55);z-index:120;align-items:center;justify-content:center;padding:16px}
.dex-modal.open{display:flex}
.dex-card{background:#fff;width:100%;max-width:560px;max-height:82vh;border-radius:28px;border:3px solid #f9dfe3;box-shadow:0 12px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease}
.dex-hd{padding:18px 22px;background:linear-gradient(135deg,#ffe5e2,#fbdce6);display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #f2bec7}
.dex-hd h3{color:#c76272;font-size:1.15rem;font-weight:800}
.dex-body{padding:18px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.dex-item{background:#fff9fa;border:2px solid #f7d7dc;border-radius:16px;padding:10px;text-align:center}
.dex-item img{width:100%;height:115px;object-fit:contain;border-radius:10px;background:#fff;margin-bottom:6px;cursor:zoom-in;transition:transform .2s}
.dex-item img:hover{transform:scale(1.04)}
.dex-item-name{font-weight:800;color:#5a4649;font-size:.95rem}
.dex-item-tag{display:inline-block;font-size:.72rem;color:#fff;padding:2px 8px;border-radius:10px;margin-top:4px;font-weight:700}

/* 圖片點擊放大燈箱 */
.zoom-modal{display:none;position:fixed;inset:0;background:rgba(40,28,30,.82);z-index:200;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.zoom-modal.open{display:flex}
.zoom-card{position:relative;background:#fff;padding:16px;border-radius:24px;border:3px solid #f9dfe3;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;align-items:center;box-shadow:0 15px 35px rgba(0,0,0,.35);animation:pop .2s ease}
.zoom-card img{max-width:84vw;max-height:72vh;object-fit:contain;border-radius:14px}
.zoom-title{margin-top:10px;font-size:1.1rem;font-weight:800;color:#c76272}
</style>
</head>
<body>
<div class="fx-bg" id="fxBg"></div>

<div class="topbar">
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div class="brand">🎁 驚喜盲盒 🎁</div>
    <div class="spacer"></div>
</div>

<div class="drawer-mask" id="mask" onclick="toggleMenu()"></div>
<nav class="drawer" id="drawer">
    <div class="drawer-hd"><span>🌸 花間小憩選單</span><button class="close-btn" onclick="toggleMenu()">✕</button></div>
    <ul class="drawer-list">
        <li><a href="index.html"><span>🏠 首頁</span><span class="arrow">&gt;</span></a></li>
        <li><a href="card.html"><span>🎴 小卡圖鑑</span><span class="arrow">&gt;</span></a></li>
        <li>
            <div class="sub-toggle" onclick="toggleSubMenu()"><span>🎁 驚喜盲盒</span><span class="arrow" id="subArrow">&gt;</span></div>
            <ul class="submenu" id="subMenu"></ul>
        </li>
    </ul>
</nav>

<div class="wrap">
    <!-- 當前盲盒系列大橫幅 + 快速切換系列小按鈕 -->
    <div class="active-series-banner" id="activeSeriesBanner">
        <div class="asb-info">
            <div class="asb-sub" id="asbSub">載入盲盒系列中...</div>
            <div class="asb-title" id="asbTitle">驚喜盲盒</div>
        </div>
        <div class="asb-actions">
            <button class="asb-sync-btn" title="重新掃描 GitHub 盲盒資料夾" onclick="forceRefreshSeries()">🔄</button>
            <button class="asb-switch-btn" onclick="openSeriesDrawer()">切換其他系列</button>
        </div>
    </div>

    <div class="quota-bar" id="quotaBar">🎟️ 剩餘抽選次數：3 / 3 次</div>
    <div class="stage-card" id="stageCard"></div>
</div>

<!-- 右下角漂浮圖鑑按鈕 -->
<button class="dex-fab" onclick="openDex()">🏅 我的已獲得圖鑑 (<span id="dexCount">0</span>)</button>

<!-- 已獲得盲盒圖鑑彈窗 -->
<div class="dex-modal" id="dexModal" onclick="if(event.target===this) closeDex()">
    <div class="dex-card">
        <div class="dex-hd">
            <h3>🏅 我的已獲得盲盒圖鑑</h3>
            <button class="close-btn" onclick="closeDex()">✕</button>
        </div>
        <div class="dex-body" id="dexBody"></div>
    </div>
</div>

<!-- 圖片放大預覽彈窗 -->
<div class="zoom-modal" id="zoomModal" onclick="if(event.target===this) closeZoom()">
    <div class="zoom-card">
        <button class="close-btn" onclick="closeZoom()" style="position:absolute;top:-14px;right:-14px;box-shadow:0 3px 10px rgba(0,0,0,.2)">✕</button>
        <img id="zoomImg" src="" alt="放大預覽">
        <div class="zoom-title" id="zoomTitle"></div>
    </div>
</div>

<script>
// ★ 1. 設定「每個系列」各自可抽選的次數上限
const MAX_DRAWS = 3;

// ★ 2. 直接鎖定你的 GitHub 儲存庫：qscxz19920516 / Kakan
const GITHUB_CONFIG = {
    owner: "qscxz19920516",
    repo: "Kakan",
    branch: "main"
};

// ★ 3. 黃金角度動態不重複調色盤產生器（前 30+ 組盲盒底色皆自動產生且完全不重複）
function getSeriesTheme(index) {
    const hue = Math.round((index * 137.508 + 28) % 360);
    const sat = index % 2 === 0 ? 74 : 66;
    const lightMain = index % 3 === 1 ? 45 : 50;
    const lightTop = Math.min(68, lightMain + 11);
    const lightBot = Math.max(34, lightMain - 9);
    return {
        color: `hsl(${hue}, ${sat}%, ${lightMain}%)`,
        softBg: `hsl(${hue}, 85%, 96%)`,
        bg: `linear-gradient(135deg, hsl(${hue}, ${sat}%, ${lightTop}%), hsl(${(hue + 14) % 360}, ${sat}%, ${lightBot}%))`
    };
}

// ★ 4. 保底備援清單（當離線或 API 達上限時自動啟用）
const FALLBACK_RAW = [
    { name: "袋裝零食", folder: "花間 × 袋裝零食", members: ["爆米花", "奶油曲奇", "棉花糖", "糖果球", "洋芋片", "巧克力"] },
    { name: "飲品", folder: "花間 × 飲品", members: ["哈密瓜午睡", "桃氣出逃", "莓有煩惱", "葡萄夜航", "橘子超載", "檸檬暴走", "藍色失重"] },
    { name: "童話反派", folder: "花間 × 童話反派", members: ["虎克船長", "後母", "烏蘇拉", "黑魔女", "賈方", "壞皇后"] },
    { name: "多巴胺女團", folder: "花間 × 多巴胺女團", members: ["C位", "Leader", "Rapper", "主唱", "主舞", "門面"] }
];

let seriesConfig = {};
FALLBACK_RAW.forEach((item, idx) => {
    const theme = getSeriesTheme(idx);
    const num = String(idx + 1).padStart(2, '0');
    seriesConfig[item.name] = {
        folder: item.folder,
        color: theme.color,
        softBg: theme.softBg,
        bg: theme.bg,
        seriesNo: `SERIES ${num}・${item.folder}`,
        members: item.members
    };
});

const cluesPool = [
    { sound: "沙沙～", text: "💡 手感線索：手感適中，上下晃動空間剛剛好！" },
    { sound: "嘩啦～", text: "👂 聽覺線索：盒內發出清脆的「嘩啦」聲，感覺很有份量！" },
    { sound: "咚咚～", text: "✨ 神秘線索：似乎感受到一股強大的公會夥伴氣息！" }
];

let curJob = "袋裝零食", pickedNo = 1, shakeCount = 0, drawnMember = "";

// 排除非盲盒的系統/網站資料夾
const EXCLUDED_FOLDERS = new Set([".github", "assets", "css", "js", "images", "img", "fonts", "職業", "職業介紹", "小卡", "小卡圖鑑", "card", "cards"]);

// 寬鬆匹配：同時支援「花間 × 〇〇」、「花間×〇〇」、「花間x〇〇」或任何放有角色圖片的盲盒資料夾
function isBlindBoxFolder(folderName) {
    if (!folderName || EXCLUDED_FOLDERS.has(folderName.toLowerCase())) return false;
    if (/^花間\s*[×xX＊*]\s*/.test(folderName)) return true;
    return false;
}

function extractShortSeriesName(folderName) {
    return folderName.replace(/^花間\s*[×xX＊*]\s*/, '').replace(/盒$/, '').trim() || folderName;
}

// 自動從 GitHub API 掃描 qscxz19920516/Kakan 儲存庫中的所有盲盒資料夾與圖片
async function loadAutoSeriesFromGitHub(bypassCache = false) {
    const { owner, repo, branch } = GITHUB_CONFIG;
    const cacheKey = `huajian_kakan_series_v3_${owner}_${repo}`;

    if (!bypassCache) {
        try {
            const cached = sessionStorage.getItem(cacheKey);
            if (cached) {
                const parsed = JSON.parse(cached);
                if (Object.keys(parsed).length > 0) {
                    seriesConfig = parsed;
                    return;
                }
            }
        } catch (e) {}
    }

    const branches = [branch, "master"];
    for (const br of branches) {
        try {
            // 加入時間戳避免瀏覽器快取 API 回應
            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${br}?recursive=1&_=${Date.now()}`);
            if (!res.ok) continue;
            const data = await res.json();
            if (!data.tree) continue;

            // 支援盲盒資料夾在最外層（花間 × 〇〇/角色.jpg）或包在「花間/」一層內（花間/花間 × 〇〇/角色.jpg）
            const folderMap = {};
            const allFolderMap = {};

            data.tree.forEach(item => {
                if (item.type !== 'blob') return;
                if (!/\.(jpg|jpeg|png|webp|gif)$/i.test(item.path)) return;

                const parts = item.path.split('/');
                if (parts.length < 2) return; // 最外層根目錄圖片（如 Kakan的原.jpg）略過

                const fileName = parts[parts.length - 1];
                const parentFolderName = parts[parts.length - 2];
                const folderRelPath = parts.slice(0, -1).join('/');
                const memberName = fileName.replace(/\.(jpg|jpeg|png|webp|gif)$/i, '');

                if (isBlindBoxFolder(parentFolderName)) {
                    if (!folderMap[folderRelPath]) {
                        folderMap[folderRelPath] = { displayName: parentFolderName, members: [] };
                    }
                    if (!folderMap[folderRelPath].members.includes(memberName)) {
                        folderMap[folderRelPath].members.push(memberName);
                    }
                } else if (!EXCLUDED_FOLDERS.has(parentFolderName.toLowerCase()) && parts.length === 2) {
                    if (!allFolderMap[folderRelPath]) {
                        allFolderMap[folderRelPath] = { displayName: parentFolderName, members: [] };
                    }
                    if (!allFolderMap[folderRelPath].members.includes(memberName)) {
                        allFolderMap[folderRelPath].members.push(memberName);
                    }
                }
            });

            // 若有符合「花間 × 〇〇」的資料夾優先使用；若用戶新建資料夾沒寫「花間 × 」前綴也能自動納入！
            const targetMap = Object.keys(folderMap).length > 0 ? folderMap : allFolderMap;
            const folderPaths = Object.keys(targetMap);

            if (folderPaths.length > 0) {
                const autoConfig = {};
                folderPaths.forEach((relPath, idx) => {
                    const info = targetMap[relPath];
                    const shortName = extractShortSeriesName(info.displayName);
                    const theme = getSeriesTheme(idx);
                    const num = String(idx + 1).padStart(2, '0');
                    autoConfig[shortName] = {
                        folder: relPath,
                        displayFolder: info.displayName,
                        color: theme.color,
                        softBg: theme.softBg,
                        bg: theme.bg,
                        seriesNo: `SERIES ${num}・${info.displayName}`,
                        members: info.members
                    };
                });
                seriesConfig = autoConfig;
                try { sessionStorage.setItem(cacheKey, JSON.stringify(autoConfig)); } catch (e) {}
                return;
            }
        } catch (e) {}
    }
}

async function forceRefreshSeries() {
    const btn = document.querySelector('.asb-sync-btn');
    if (btn) btn.innerText = '⏳';
    await loadAutoSeriesFromGitHub(true);
    renderSideMenu();
    selectSeries(curJob);
    if (btn) btn.innerText = '🔄';
}

// 動態產生側邊漢堡選單的所有盲盒系列項目
function renderSideMenu() {
    const subMenu = document.getElementById('subMenu');
    if (!subMenu) return;
    let html = '';
    Object.keys(seriesConfig).forEach(key => {
        const cfg = seriesConfig[key];
        const label = cfg.displayFolder || cfg.folder;
        html += `<li><a href="box.html?job=${encodeURIComponent(label)}" data-series="${key}" onclick="goBox(event, '${key}')"><span>${label}</span><span class="arrow">&gt;</span></a></li>`;
    });
    subMenu.innerHTML = html;
}

function getUsedDraws(job = curJob) {
    return parseInt(localStorage.getItem('huajian_draws_' + job) || '0', 10);
}
function addUsedDraw(job = curJob) {
    const next = getUsedDraws(job) + 1;
    localStorage.setItem('huajian_draws_' + job, next);
}

function getDrawnList(job = curJob) {
    try {
        return JSON.parse(localStorage.getItem('huajian_drawn_list_' + job) || '[]');
    } catch (e) {
        return [];
    }
}
function addDrawnMember(name, job = curJob) {
    const list = getDrawnList(job);
    if (!list.includes(name)) {
        list.push(name);
        localStorage.setItem('huajian_drawn_list_' + job, JSON.stringify(list));
    }
}

function toggleMenu(){ document.getElementById('drawer').classList.toggle('open'); document.getElementById('mask').classList.toggle('open'); }
function toggleSubMenu(){ document.getElementById('subMenu').classList.toggle('open'); document.getElementById('subArrow').classList.toggle('rot'); }
function openSeriesDrawer(){
    document.getElementById('drawer').classList.add('open');
    document.getElementById('mask').classList.add('open');
    document.getElementById('subMenu').classList.add('open');
    document.getElementById('subArrow').classList.add('rot');
    const activeEl = document.querySelector('#subMenu a.active-series');
    if (activeEl) activeEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function goBox(e, job){ e.preventDefault(); selectSeries(normalizeJobName(job)); toggleMenu(); }

function updateQuotaUI(){
    const used = getUsedDraws(curJob);
    const left = Math.max(0, MAX_DRAWS - used);
    const bar = document.getElementById('quotaBar');
    if(bar) {
        bar.innerText = left > 0 
            ? `🎟️ 【${curJob}盲盒】剩餘抽選次數：${left} / ${MAX_DRAWS} 次` 
            : `🔒 【${curJob}盲盒】抽選次數已用完（${MAX_DRAWS} / ${MAX_DRAWS} 次）`;
    }
}

function selectSeries(job){
    const keys = Object.keys(seriesConfig);
    curJob = seriesConfig[job] ? job : (keys[0] || "袋裝零食");
    const cfg = seriesConfig[curJob];
    const banner = document.getElementById('activeSeriesBanner');
    const sub = document.getElementById('asbSub');
    const title = document.getElementById('asbTitle');
    if(banner && cfg){
        banner.style.borderColor = cfg.color;
        sub.style.color = cfg.color;
        sub.innerText = cfg.seriesNo;
        title.innerText = `${curJob}盲盒`;
    }
    document.querySelectorAll('#subMenu a').forEach(a => {
        const isCurrent = a.dataset.series === curJob;
        a.classList.toggle('active-series', isCurrent);
        const oldPill = a.querySelector('.active-pill');
        if (oldPill) oldPill.remove();
        const arrowEl = a.querySelector('.arrow');
        if (isCurrent && cfg) {
            a.style.setProperty('--series-color', cfg.color);
            a.style.setProperty('--series-soft', cfg.softBg || '#fff0f3');
            if (arrowEl) {
                arrowEl.insertAdjacentHTML('beforebegin', '<span class="active-pill">使用中</span>');
            }
        } else {
            a.style.removeProperty('--series-color');
            a.style.removeProperty('--series-soft');
        }
    });
    updateQuotaUI();
    renderGrid();
}

function renderGrid(){
    const cfg = seriesConfig[curJob]; let h = '';
    for(let i=1; i<=6; i++){ const n = '0'+i; h += `<div class="box-item" onclick="pickBox(${i})"><div class="mini-box" style="background:${cfg.bg}"><div class="q-circle" style="color:${cfg.color}">?</div><span class="no-pill">NO.${n}</span></div><div class="pick-lbl">選取 #${n}</div></div>`; }
    document.getElementById('stageCard').innerHTML = `<div class="series-tag" style="color:${cfg.color}">${cfg.seriesNo}</div><div class="stage-title">請選擇一個心儀的盲盒</div><div class="box-grid">${h}</div><div class="hint-banner">✨ 點擊任意盲盒拿起它，搖一搖聽聽裡面的秘密！</div>`;
}

function pickBox(no){
    if(getUsedDraws(curJob) >= MAX_DRAWS){
        alert(`【${curJob}盲盒】每人最多只能抽選 ${MAX_DRAWS} 次喔！可以點擊上方「切換其他系列」繼續抽～`);
        return;
    }
    pickedNo = no; shakeCount = 0;
    const allList = seriesConfig[curJob].members;
    const drawnList = getDrawnList(curJob);
    const available = allList.filter(name => !drawnList.includes(name));
    
    if(available.length === 0){
        alert(`【${curJob}盲盒】的所有角色您都已經抽過一輪囉！`);
        return;
    }
    drawnMember = available[Math.floor(Math.random()*available.length)];
    renderDetail();
}

function renderDetail(snd="?", clue="💡 提示：點擊「搖一搖」可以知道盒子裡的重量與聲音喔！"){
    const cfg = seriesConfig[curJob], n = '0'+pickedNo, isQ = snd === "?";
    document.getElementById('stageCard').innerHTML = `<div class="series-tag" style="color:${cfg.color}">${cfg.seriesNo}</div><div class="stage-title">已拿起盲盒 #${n}</div><div class="big-box-wrap"><div class="big-box" id="bigBox" style="background:${cfg.bg}"><div class="tear-strip">&gt;&gt;&gt;&gt;&gt;</div>${isQ?`<div class="big-q" style="color:${cfg.color}">?</div>`:`<div class="sound-bubble" style="margin-top:24px">${snd}</div>`}<span class="no-pill" style="margin-top:12px;font-size:.8rem">NO.${n}</span></div></div><div class="clue-box">${clue}</div><div class="action-row"><button class="btn-shake" onclick="shakeBox()" ${shakeCount>=3?'disabled':''}>👋 搖一搖 (${shakeCount}/3)</button><button class="btn-open" style="background:${cfg.color}" onclick="openBox()">✨ 立即撕開封條</button></div>`;
}

function shakeBox(){ if(shakeCount>=3) return; const c = cluesPool[shakeCount++]; renderDetail(c.sound, shakeCount===3 ? "🔥 線索已全部掌握！準備好撕開封條揭曉答案了嗎？" : c.text); const b = document.getElementById('bigBox'); b.classList.remove('shaking'); void b.offsetWidth; b.classList.add('shaking'); }

function updateDexCount() {
    let total = 0;
    const allKeys = new Set(Object.keys(seriesConfig));
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith('huajian_drawn_list_')) {
            allKeys.add(k.replace('huajian_drawn_list_', ''));
        }
    }
    allKeys.forEach(job => { total += getDrawnList(job).length; });
    const el = document.getElementById('dexCount');
    if (el) el.innerText = total;
}

function openDex() {
    const body = document.getElementById('dexBody');
    let html = '';
    Object.keys(seriesConfig).forEach(job => {
        const cfg = seriesConfig[job];
        getDrawnList(job).forEach(name => {
            html += `<div class="dex-item"><img src="${cfg.folder}/${name}.jpg" alt="${name}" title="點擊放大檢視" onclick="openZoom('${cfg.folder}','${name}','${job}')" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='${cfg.folder}/${name}.JPG';}else if(this.dataset.step==1){this.dataset.step=2;this.src='${cfg.folder}/${name}.png';}else{this.onerror=null;this.src='${cfg.folder}/${name}.PNG';}"><div class="dex-item-name">${name}</div><span class="dex-item-tag" style="background:${cfg.color}">${job}</span></div>`;
        });
    });
    body.innerHTML = html || '<div style="grid-column:1/-1;text-align:center;padding:40px 10px;color:#947479;font-weight:700">🌸 還沒有抽到任何小卡喔，快去挑選盲盒吧！</div>';
    document.getElementById('dexModal').classList.add('open');
}

function closeDex() {
    document.getElementById('dexModal').classList.remove('open');
}

function openZoom(folder, name, job) {
    const zImg = document.getElementById('zoomImg');
    let step = 0;
    const exts = ['.jpg', '.JPG', '.png', '.PNG', '.webp'];
    zImg.onerror = function() {
        step++;
        if (step < exts.length) {
            this.src = folder + '/' + name + exts[step];
        } else {
            this.onerror = null;
        }
    };
    zImg.src = folder + '/' + name + exts[0];
    document.getElementById('zoomTitle').innerText = `🌸 ${job}・${name}`;
    document.getElementById('zoomModal').classList.add('open');
}

function closeZoom() {
    document.getElementById('zoomModal').classList.remove('open');
}

function normalizeJobName(rawName) {
    const firstKey = Object.keys(seriesConfig)[0] || "袋裝零食";
    if (!rawName) return firstKey;
    if (seriesConfig[rawName]) return rawName;
    const cleaned = extractShortSeriesName(rawName);
    if (seriesConfig[cleaned]) return cleaned;
    const matched = Object.keys(seriesConfig).find(k => rawName.includes(k) || k.includes(cleaned));
    return matched || firstKey;
}

function openBox(){
    if(getUsedDraws(curJob) >= MAX_DRAWS){
        alert(`【${curJob}盲盒】每人最多只能抽選 ${MAX_DRAWS} 次喔！`);
        return;
    }
    addUsedDraw(curJob);
    addDrawnMember(drawnMember, curJob);
    updateQuotaUI();
    updateDexCount();

    const cfg = seriesConfig[curJob], left = Math.max(0, MAX_DRAWS - getUsedDraws(curJob));
    const btn = left > 0 ? `<button class="btn-open" style="background:${cfg.color}" onclick="pickBox(pickedNo)">🎁 再抽一盒 (剩${left}次)</button>` : `<button class="btn-open" style="background:#b8a6a9;cursor:not-allowed" disabled>🔒 ${curJob}次數已用完</button>`;
    document.getElementById('stageCard').innerHTML = `<div id="confettiBox"></div><div class="rarity-pill" style="background:${cfg.color}">🌸 花間小憩・${curJob}系列 🌸</div><div class="result-img-box"><img src="${cfg.folder}/${drawnMember}.jpg" alt="${drawnMember}" title="點擊放大檢視" onclick="openZoom('${cfg.folder}','${drawnMember}','${curJob}')" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='${cfg.folder}/${drawnMember}.JPG';}else if(this.dataset.step==1){this.dataset.step=2;this.src='${cfg.folder}/${drawnMember}.png';}else{this.onerror=null;this.src='${cfg.folder}/${drawnMember}.PNG';}"></div><div class="result-name">🎉 ${drawnMember}</div><div class="result-quote">「${curJob}夥伴・${drawnMember} 閃亮登場！」</div><div class="action-row"><button class="btn-shake" style="border-color:#d48c95;color:#c76272;background:#fff" onclick="renderGrid()">🔙 返回盲盒區</button>${btn}</div>`;
    const box = document.getElementById('confettiBox'), cols = ['#ff7675','#74b9ff','#ffeaa7','#55efc4','#fd79a8'];
    for(let i=0;i<35;i++){ const c=document.createElement('div'); c.className='confetti'; c.style.left=(Math.random()*100)+'%'; c.style.background=cols[i%5]; c.style.animationDelay=(Math.random()*0.4)+'s'; box.appendChild(c); }
}

window.addEventListener('DOMContentLoaded', async function() {
    const bg = document.getElementById('fxBg');
    if (bg && bg.children.length === 0) {
        for(let i=0;i<45;i++){ const p=document.createElement('div');p.className='petal'; const s=9+Math.random()*13;p.style.width=s+'px';p.style.height=(s*.75)+'px'; p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=(6+Math.random()*8)+'s'; p.style.animationDelay=(-Math.random()*10)+'s';bg.appendChild(p); }
        for(let i=0;i<25;i++){ const b=document.createElement('div');b.className='bubble'; const s=20+Math.random()*45;b.style.width=s+'px';b.style.height=s+'px'; b.style.left=(Math.random()*100)+'vw';b.style.animationDuration=(10+Math.random()*10)+'s'; b.style.animationDelay=(-Math.random()*8)+'s';bg.appendChild(b); }
    }
    await loadAutoSeriesFromGitHub();
    renderSideMenu();
    const u = new URLSearchParams(window.location.search).get('job');
    selectSeries(normalizeJobName(u));
    updateQuotaUI();
    updateDexCount();
});
</script>
