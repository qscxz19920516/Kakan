<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>花間小憩 - 驚喜盲盒抽獎箱</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang TC","Microsoft JhengHei","Rounded Mplus 1c",sans-serif}
body{background:linear-gradient(180deg,#fff6f5 0%,#fff9f8 50%,#fdf2f4 100%);color:#5a4649;line-height:1.6;min-height:100vh;overflow-x:hidden;position:relative;padding-bottom:75px}
.fx-bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{position:absolute;top:-30px;background:linear-gradient(135deg,#ffe4ea 0%,#ffb3c6 50%,#ff8fa3 100%);border-radius:18px 0 18px 0;box-shadow:0 2px 6px rgba(255,158,181,.3);opacity:.85;animation:fall ease-in-out infinite}
.bubble{position:absolute;bottom:-60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.95),rgba(135,206,250,.32));border:1.5px solid rgba(173,216,230,.65);box-shadow:0 2px 8px rgba(135,206,250,.2);animation:rise ease-in-out infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0deg) translateX(0);opacity:0}10%{opacity:.9}35%{transform:translateY(35vh) rotate(120deg) translateX(35px)}65%{transform:translateY(70vh) rotate(240deg) translateX(-25px)}90%{opacity:.85}100%{transform:translateY(108vh) rotate(380deg) translateX(30px);opacity:0}}
@keyframes rise{0%{transform:translateY(0) scale(.8);opacity:0}20%{opacity:.6}80%{opacity:.5}100%{transform:translateY(-110vh) scale(1.15);opacity:0}}

.submenu li a.active-series{
    background:linear-gradient(90deg,var(--series-soft,#fff0f3) 0%,#fff 100%);
    color:var(--series-color,#c76272);
    font-weight:900;
    border-left:5px solid var(--series-color,#c76272);
    padding-left:31px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.8);
}
.active-pill{
    font-size:.7rem;
    font-weight:800;
    color:#fff;
    background:var(--series-color,#c76272);
    padding:2px 8px;
    border-radius:10px;
    letter-spacing:.5px;
    flex-shrink:0;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.wrap{position:relative;z-index:1;max-width:680px;margin:20px auto;padding:0 16px}

/* 當前盲盒系列大橫幅 */

.new-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#ff4757,#ff6b81);
    color:#fff;
    font-size:.68rem;
    font-weight:900;
    padding:1px 7px;
    border-radius:999px;
    letter-spacing:.6px;
    margin-left:6px;
    box-shadow:0 2px 6px rgba(255,71,87,.35);
    vertical-align:middle;
}
.asb-title-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:nowrap;
}
.asb-collect-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    background:#fff0f3;
    border:1.5px solid #f2bec7;
    color:#c76272;
    font-size:.76rem;
    font-weight:900;
    padding:2px 9px;
    border-radius:12px;
    margin-top:4px;
}
.stage-collect-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff8f9;
    border:1.5px solid #f7d7dc;
    color:#7a5c61;
    font-size:.82rem;
    font-weight:800;
    padding:4px 12px;
    border-radius:14px;
    margin-bottom:10px;
}

.active-series-banner{background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:24px;padding:14px 18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(226,158,168,.14);border:2px solid #f39c12;display:flex;align-items:center;justify-content:space-between;gap:12px}
.asb-info{text-align:left;min-width:0}
.asb-sub{font-size:.74rem;font-weight:800;letter-spacing:1px;color:#f39c12;margin-bottom:2px}
.asb-title{font-size:1.2rem;font-weight:900;color:#5a4649;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asb-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.asb-switch-btn{background:#fff7f8;border:2px solid #f0a8b4;color:#c76272;padding:8px 14px;border-radius:18px;font-size:.84rem;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:.2s;box-shadow:0 2px 6px rgba(226,158,168,.15)}
.asb-switch-btn:hover{background:#c76272;border-color:#c76272;color:#fff;transform:translateY(-1px)}
.asb-sync-btn{background:#fff;border:1.5px solid #e6c5ca;color:#8c7075;width:36px;height:36px;border-radius:50%;font-size:.95rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.asb-sync-btn:hover{border-color:#c76272;color:#c76272;transform:rotate(90deg)}


/* 御神籤吉籤獎勵：盲盒單次重置券橫幅 */
.omikuji-ticket-bar{display:none;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #f59e0b;border-radius:20px;padding:10px 14px;margin-bottom:14px;box-shadow:0 4px 12px rgba(245,158,11,.16);align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.omikuji-ticket-bar.show{display:flex}
.otb-text{font-size:.86rem;font-weight:800;color:#92400e;text-align:left;line-height:1.4}
.otb-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;padding:8px 14px;border-radius:16px;font-size:.82rem;font-weight:900;cursor:pointer;box-shadow:0 3px 8px rgba(217,119,6,.28);transition:.2s;white-space:nowrap}
.otb-btn:hover{transform:translateY(-1px);filter:brightness(1.06)}

.quota-bar{background:#fff8f9;border:2px dashed #f2bec7;color:#c76272;padding:8px 18px;border-radius:20px;font-weight:800;font-size:.92rem;margin-bottom:16px;text-align:center;box-shadow:0 3px 8px rgba(226,158,168,.1)}

.stage-card{background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-radius:28px;padding:24px 18px;box-shadow:0 8px 25px rgba(226,158,168,.16);border:2px solid #f9dfe3;text-align:center;position:relative;overflow:hidden}
.series-tag{font-size:.82rem;font-weight:800;letter-spacing:1px;margin-bottom:4px}
.stage-title{font-size:1.38rem;font-weight:800;color:#5a4649;margin-bottom:16px}

/* 抽獎箱舞台區 */
.lottery-stage{position:relative;padding:18px 0 12px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lottery-box-wrap{position:relative;width:270px;max-width:78vw;margin:0 auto;cursor:pointer;user-select:none}
.lottery-box-img{width:100%;height:auto;display:block;border-radius:22px;filter:drop-shadow(0 10px 18px rgba(180,110,125,.22));transition:transform .2s ease}
.lottery-box-wrap:hover .lottery-box-img{transform:scale(1.02)}

/* 左上角洞口留白區漫畫狀聲詞氣泡（完全不遮擋角色與箱身） */
.sound-comic{
    position:absolute;
    top:-14px;
    left:-14px;
    z-index:6;
    pointer-events:none;
    background:linear-gradient(135deg,#fffbe6 0%,#ffe066 100%);
    color:#6b4423;
    padding:6px 15px;
    border-radius:20px 20px 6px 20px;
    font-size:1.08rem;
    font-weight:900;
    letter-spacing:1px;
    border:2.5px solid #fff;
    box-shadow:0 5px 14px rgba(214,137,16,.28), 0 0 0 2px #f5cba7;
    white-space:nowrap;
    animation:comicPopFloat 1.65s cubic-bezier(.22,1,.36,1) forwards;
}
.draw-comic{
    position:absolute;
    top:-14px;
    left:-12px;
    z-index:6;
    pointer-events:none;
    background:linear-gradient(135deg,#fff 0%,#ffeef2 100%);
    color:#c76272;
    padding:6px 15px;
    border-radius:20px 20px 6px 20px;
    font-size:.96rem;
    font-weight:900;
    border:2.5px solid #fff;
    box-shadow:0 5px 14px rgba(199,98,114,.28), 0 0 0 2px #f0a8b4;
    white-space:nowrap;
    animation:pop .25s ease forwards;
}
@keyframes pop{0%{transform:scale(.5) rotate(-8deg)}80%{transform:scale(1.1) rotate(-5deg)}100%{transform:scale(1) rotate(-6deg)}}
@keyframes comicPopFloat{
    0%{opacity:0;transform:translate(8px,10px) scale(.65) rotate(-10deg)}
    16%{opacity:1;transform:translate(0,0) scale(1.08) rotate(-6deg)}
    72%{opacity:1;transform:translate(-2px,-4px) scale(1) rotate(-5deg)}
    100%{opacity:0;transform:translate(-4px,-12px) scale(.94) rotate(-4deg)}
}

/* 抽獎箱搖晃動畫 */
.shaking{animation:boxShake .48s ease-in-out}
@keyframes boxShake{
    0%,100%{transform:rotate(0deg) translateY(0)}
    18%{transform:rotate(-8deg) translateY(-4px) scale(1.03)}
    36%{transform:rotate(8deg) translateY(-6px) scale(1.04)}
    54%{transform:rotate(-6deg) translateY(-3px)}
    72%{transform:rotate(5deg) translateY(-2px)}
}

.clue-box{background:#fff8f9;border:1.5px solid #f7d7dc;border-radius:16px;padding:12px 16px;margin:12px 0 18px;font-size:.9rem;font-weight:700;color:#7a5c61;min-height:48px;display:flex;align-items:center;justify-content:center}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-shake{padding:14px;border-radius:18px;border:2px solid #f39c12;background:#fffdf5;color:#d68910;font-size:1rem;font-weight:800;cursor:pointer;transition:.2s}
.btn-shake:disabled{opacity:.5;cursor:not-allowed}
.btn-open{padding:14px;border-radius:18px;border:none;color:#fff;font-size:1rem;font-weight:800;cursor:pointer;box-shadow:0 5px 15px rgba(0,0,0,.15);transition:.2s}
.btn-open:hover,.btn-shake:not(:disabled):hover{transform:translateY(-2px)}
.btn-open:disabled{opacity:.55;cursor:not-allowed;transform:none}

/* 揭曉結果區 */
.rarity-pill{display:inline-block;padding:4px 16px;border-radius:20px;font-size:.82rem;font-weight:900;color:#fff;margin-bottom:14px;letter-spacing:1px}
.result-img-box{width:230px;height:230px;margin:0 auto 14px;border-radius:22px;background:#fff9fa;border:3px solid #f9dfe3;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 8px 20px rgba(226,158,168,.2);animation:popResult .35s ease}
@keyframes popResult{0%{transform:scale(.6)}80%{transform:scale(1.06)}100%{transform:scale(1)}}
.result-img-box img{width:100%;height:100%;object-fit:contain;cursor:zoom-in;transition:transform .2s}
.result-img-box img:hover{transform:scale(1.04)}
.result-name{font-size:1.6rem;font-weight:900;color:#c76272;margin-bottom:4px}
.result-quote{font-size:.9rem;color:#8c7075;margin-bottom:20px;font-weight:600}
.confetti{position:absolute;width:10px;height:10px;top:-10px;animation:cfall 2.2s ease-out forwards}
@keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(460px) rotate(720deg);opacity:0}}

/* 右下角浮動圖鑑按鈕與收集冊彈窗 */
.dex-fab{position:fixed;right:20px;bottom:22px;z-index:80;background:linear-gradient(135deg,#ff9a9e,#f68084);color:#fff;border:2px solid #fff;padding:12px 18px;border-radius:30px;font-weight:800;font-size:.95rem;cursor:pointer;box-shadow:0 6px 18px rgba(246,128,132,.4);display:flex;align-items:center;gap:6px;transition:.25s}
.dex-fab:hover{transform:translateY(-3px) scale(1.03)}
.dex-modal{display:none;position:fixed;inset:0;background:rgba(90,70,73,.55);z-index:120;align-items:center;justify-content:center;padding:16px}
.dex-modal.open{display:flex}
.dex-card{background:#fff;width:100%;max-width:560px;max-height:82vh;border-radius:28px;border:3px solid #f9dfe3;box-shadow:0 12px 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;animation:popResult .25s ease}
.dex-hd{padding:18px 22px;background:linear-gradient(135deg,#ffe5e2,#fbdce6);display:flex;justify-content:space-between;align-items:center;border-bottom:2px dashed #f2bec7}
.dex-hd h3{color:#c76272;font-size:1.15rem;font-weight:800}
.dex-clean-strip{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px;margin-bottom:2px;border-bottom:2px dashed #f2bec7}
.dex-clean-pill{display:inline-flex;align-items:center;gap:5px;background:#fff8f9;border:1.5px solid #f2bec7;border-radius:12px;padding:3px 9px;font-size:.75rem;font-weight:800;color:#5a4649}
.dex-clean-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

.dex-top-bar{grid-column:1/-1;background:#fff8f9;border:2px solid #f7d7dc;border-radius:18px;padding:12px 14px;margin-bottom:4px}
.dex-series-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.dex-select{flex:1;min-width:160px;padding:8px 12px;border-radius:14px;border:2px solid #f0a8b4;background:#fff;color:#5a4649;font-size:.9rem;font-weight:900;outline:none;cursor:pointer}
.dex-mode-btn{padding:7px 12px;border-radius:14px;border:1.5px solid #f0a8b4;background:#fff;color:#c76272;font-size:.78rem;font-weight:900;cursor:pointer;white-space:nowrap;transition:.18s}
.dex-mode-btn.active{background:#c76272;color:#fff;border-color:#c76272}

.dex-meta-row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;font-weight:800;color:#7a5c61;margin-bottom:6px}
.dex-quota-tag{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid #f2bec7;color:#c76272;padding:2px 9px;border-radius:12px;font-size:.76rem;font-weight:900}

.dex-prog-hd{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:800;color:#7a5c61;margin-bottom:5px}

.dex-jump-series-btn{margin-top:8px;width:100%;padding:8px 12px;border-radius:14px;border:none;color:#fff;font-size:.82rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 10px rgba(0,0,0,.14);transition:.18s}
.dex-jump-series-btn:hover{transform:translateY(-1px);filter:brightness(1.05)}

.dex-prog-track{width:100%;height:10px;background:#fce8ec;border-radius:999px;overflow:hidden;border:1px solid #f2bec7}
.dex-prog-fill{height:100%;background:linear-gradient(90deg,#ff9a9e,#f68084);border-radius:999px;transition:width .25s ease}
.dex-item.locked{background:#f7f5f6;border-style:dashed;border-color:#e5d8db}
.dex-item.locked img{filter:brightness(0) opacity(0.16);cursor:default}
.dex-item.locked img:hover{transform:none}
.dex-item.locked .dex-item-name{color:#a89396}
.dex-item-tag.locked-tag{background:#cfc2c5 !important;color:#6e5b5f !important}

.dex-body{padding:18px;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.dex-item{background:#fff9fa;border:2px solid #f7d7dc;border-radius:16px;padding:10px;text-align:center}
.dex-item img{width:100%;height:115px;object-fit:contain;border-radius:10px;background:#fff;margin-bottom:6px;cursor:zoom-in;transition:transform .2s}
.dex-item img:hover{transform:scale(1.04)}
.dex-item-name{font-weight:800;color:#5a4649;font-size:.95rem}
.dex-item-tag{display:inline-block;font-size:.72rem;color:#fff;padding:2px 8px;border-radius:10px;margin-top:4px;font-weight:700}

.zoom-modal{display:none;position:fixed;inset:0;background:rgba(40,28,30,.82);z-index:200;align-items:center;justify-content:center;padding:20px;flex-direction:column}
.zoom-modal.open{display:flex}
.zoom-card{position:relative;background:#fff;padding:16px;border-radius:24px;border:3px solid #f9dfe3;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;align-items:center;box-shadow:0 15px 35px rgba(0,0,0,.35);animation:popResult .2s ease}
.zoom-card img{max-width:84vw;max-height:72vh;object-fit:contain;border-radius:14px}
.zoom-title{margin-top:10px;font-size:1.1rem;font-weight:800;color:#c76272}
</style>

<script>
const MAX_DRAWS = 3;
let seriesConfig = {};

// ★ 七款專屬抽獎箱隨機池（每次進入、切換系列或再抽一次時隨機搭配，不提供手動選擇）
const BOX_SKINS = [
    "盲盒箱子",
    "盲盒箱子1",
    "盲盒箱子2",
    "盲盒箱子3",
    "盲盒箱子4",
    "盲盒箱子5",
    "盲盒箱子6"
];

function pickRandomBoxSkin(excludeIdx = -1) {
    if (BOX_SKINS.length <= 1) return 0;
    let next = Math.floor(Math.random() * BOX_SKINS.length);
    if (next === excludeIdx) {
        next = (next + 1 + Math.floor(Math.random() * (BOX_SKINS.length - 1))) % BOX_SKINS.length;
    }
    return next;
}

const cluesPool = [
    { sound: "沙沙～", text: "💡 手感線索：搖晃抽獎箱時聽到「沙沙」聲，感覺裡面藏著可愛的小夥伴！" },
    { sound: "嘩啦～", text: "👂 聽覺線索：箱內傳來清脆的「嘩啦」聲，幸運小盒正在往洞口靠近！" },
    { sound: "咚咚～", text: "✨ 神秘線索：感受到一股強大的公會夥伴氣息，伸手一抓準沒錯！" }
];


function getSeriesCollectionStats(job = curJob) {
    const cfg = seriesConfig && seriesConfig[job];
    const members = (cfg && Array.isArray(cfg.members)) ? cfg.members : [];
    const totalCount = members.length;
    const drawnSet = new Set(getDrawnList(job));
    const ownedCount = members.filter(m => drawnSet.has(m)).length;
    return { ownedCount, totalCount };
}

let curJob = "袋裝零食";
let curSkinIdx = Math.floor(Math.random() * BOX_SKINS.length);
let shakeCount = 0;
let isDrawing = false;

function highlightActiveMenu() {
    const cfg = seriesConfig[curJob];
        document.querySelectorAll('#subMenu a').forEach(a => {
        const isCurrent = a.dataset.series === curJob;
        a.classList.toggle('active-series', isCurrent);
        const oldPill = a.querySelector('.active-pill');
        if (oldPill) oldPill.remove();
        const arrowEl = a.querySelector('.arrow');
        if (isCurrent && cfg) {
            a.style.setProperty('--series-color', cfg.color);
            a.style.setProperty('--series-soft', cfg.softBg || '#fff0f3');
            if (arrowEl) {
                arrowEl.insertAdjacentHTML('beforebegin', '<span class="active-pill">使用中</span>');
            }
        } else {
            a.style.removeProperty('--series-color');
            a.style.removeProperty('--series-soft');
        }
    });
}

async function forceRefreshSeries() {
    const btn = document.querySelector('.asb-sync-btn');
    if (btn) btn.innerText = '⏳';
    try {

// ★ 隱藏密技：連續點擊頂部「驚喜盲盒」四個字 5 次並輸入通關密語，可重置抽選次數（完整保留已獲得圖鑑）
const SECRET_CODE = "百百好可愛";
let secretTapCount = 0;
let secretTapTimer = null;

function triggerSecretReset() {
    secretTapCount++;
    clearTimeout(secretTapTimer);
    secretTapTimer = setTimeout(() => { secretTapCount = 0; }, 2000);

    if (secretTapCount < 5) return;
    secretTapCount = 0;

    const input = prompt("🌸 觸發花間小憩隱藏密技！\n請輸入通關密語以重置抽選次數（已獲得圖鑑會完整保留）：");
    if (input === null) return;
    if (input.trim().toLowerCase() !== SECRET_CODE.toLowerCase()) {
        alert("❌ 密語不正確喔！");
        return;
    }
    const resetAll = confirm("密語驗證成功！\n\n【確定】重置「全部系列」的抽選次數\n【取消】僅重置目前【" + curJob + "盲盒】的抽選次數\n\n（註：所有已獲得圖鑑小卡皆會完整保留）");
    if (resetAll) {
        const keysToClear = new Set(Object.keys(seriesConfig));
        for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k && k.startsWith('huajian_draws_')) {
                keysToClear.add(k.replace('huajian_draws_', ''));
            }
        }
        keysToClear.forEach(job => localStorage.removeItem('huajian_draws_' + job));
        alert("✨ 已重置全部系列的抽選次數，已獲得圖鑑已完整保留！");
    } else {
        localStorage.removeItem('huajian_draws_' + curJob);
        alert("✨ 已重置【" + curJob + "盲盒】的抽選次數，已獲得圖鑑已完整保留！");
    }
    updateQuotaUI();
    renderLotteryBox();
}

function getDrawnList(job = curJob) {
    try {
        return JSON.parse(localStorage.getItem('huajian_drawn_list_' + job) || '[]');

}
function addDrawnMember(name, job = curJob) {
    const list = getDrawnList(job);

        list.push(name);
        localStorage.setItem('huajian_drawn_list_' + job, JSON.stringify(list));

}

function shakeLotteryBox() {

        ? "🔥 抽獎箱晃動得超有感覺！快點擊「伸手抽出盲盒」看看抽到誰！"

function drawFromLotteryBox() {
    if (isDrawing) return;
    if (getUsedDraws(curJob) >= MAX_DRAWS) {
        alert(`【${curJob}盲盒】每人最多只能抽選 ${MAX_DRAWS} 次喔！可以點擊上方「切換其他系列」繼續抽～`);
        return;
    }
    const allList = seriesConfig[curJob].members;
    const drawnList = getDrawnList(curJob);
    const available = allList.filter(name => !drawnList.includes(name));
    if (available.length === 0) {
        alert(`【${curJob}盲盒】的所有角色您都已經抽過一輪囉！`);
        return;
    }

    isDrawing = true;
    const chosen = available[Math.floor(Math.random() * available.length)];

    const wrap = document.getElementById('lotteryBoxWrap');
    const slot = document.getElementById('comicBubbleSlot');
    if (slot) {
        slot.innerHTML = `<div class="draw-comic">✨ 抽出中...</div>`;
    }
    if (wrap) {
        wrap.classList.remove('shaking');
        void wrap.offsetWidth;
        wrap.classList.add('shaking');
    }

    setTimeout(() => {
        addUsedDraw(curJob);
        addDrawnMember(chosen, curJob);
        updateQuotaUI();
        updateDexCount();
        shakeCount = 0;
        isDrawing = false;
        revealDrawnResult(chosen);

}

let dexViewMode = "series"; // "series" (單一系列全圖鑑含剪影) | "owned" (全部已獲得小卡)
let dexSelectedJob = "";

function setDexViewMode(mode) {
    dexViewMode = mode;
    openDex(dexSelectedJob || curJob);
}

function openDex(targetJob) {
    const body = document.getElementById('dexBody');
    const keys = Object.keys(seriesConfig || {});
    if (targetJob && seriesConfig[targetJob]) {
        dexSelectedJob = targetJob;
    } else if (!dexSelectedJob || !seriesConfig[dexSelectedJob]) {
        dexSelectedJob = seriesConfig[curJob] ? curJob : (keys[0] || "");
    }

    const optionsHtml = keys.map(k => {
        const c = seriesConfig[k];
        const lbl = (c && (c.displayFolder || c.folder)) || k;
        const sel = (k === dexSelectedJob) ? ' selected' : '';
        return `<option value="${k.replace(/"/g, '&quot;')}"${sel}>${lbl}</option>`;
    }).join('');

    let html = '';

    if (dexViewMode === "owned") {
        let ownedCards = '';
        let totalOwnedAll = 0;
        keys.forEach(job => {
            const cfg = seriesConfig[job];
            if (!cfg) return;
            const drawn = getDrawnList(job);
            totalOwnedAll += drawn.length;
            drawn.forEach(name => {
                ownedCards += `<div class="dex-item"><img src="${cfg.folder}/${name}.jpg" alt="${name}" title="點擊放大檢視" onclick="openZoom('${cfg.folder}','${name}','${job}')" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='${cfg.folder}/${name}.JPG';}else if(this.dataset.step==1){this.dataset.step=2;this.src='${cfg.folder}/${name}.png';}else{this.onerror=null;this.src='${cfg.folder}/${name}.PNG';}"><div class="dex-item-name">${name}</div><span class="dex-item-tag" style="background:${cfg.color}">${job}・剩${Math.max(0, MAX_DRAWS - getUsedDraws(job))}次</span></div>`;
            });
        });

        html += `
            <div class="dex-top-bar">
                <div class="dex-series-row">
                    <span style="font-weight:900;color:#c76272;font-size:.92rem">✨ 全部已獲得小卡（共 ${totalOwnedAll} 張）</span>
                    <div style="display:flex;gap:6px">
                        <button type="button" class="dex-mode-btn" onclick="setDexViewMode('series')">系列圖鑑</button>
                        <button type="button" class="dex-mode-btn active" onclick="setDexViewMode('owned')">只看已抽到</button>
                    </div>
                </div>
            </div>
        ` + (ownedCards || '<div style="grid-column:1/-1;text-align:center;padding:36px 10px;color:#947479;font-weight:700">🌸 還沒有抽到任何小卡喔，快去搖搖抽獎箱吧！</div>');
    } else {
        const cfg = seriesConfig[dexSelectedJob] || { folder: ".", displayFolder: dexSelectedJob, color: "#c76272", members: [] };
        const members = Array.isArray(cfg.members) ? cfg.members : [];
        const drawnSet = new Set(getDrawnList(dexSelectedJob));
        const ownedCount = members.filter(m => drawnSet.has(m)).length;
        const totalCount = members.length;
        const pct = totalCount > 0 ? Math.round((ownedCount / totalCount) * 100) : 0;

        html += `
            <div class="dex-top-bar">
                <div class="dex-series-row">
                    <select class="dex-select" onchange="openDex(this.value)">${optionsHtml}</select>
                    <div style="display:flex;gap:6px">
                        <button type="button" class="dex-mode-btn active" onclick="setDexViewMode('series')">系列圖鑑</button>
                        <button type="button" class="dex-mode-btn" onclick="setDexViewMode('owned')">只看已抽到</button>
                    </div>
                </div>
                <div class="dex-meta-row">
                    <span>📦 ${cfg.displayFolder || dexSelectedJob} 收集進度：<b>${ownedCount} / ${totalCount} 款 (${pct}%)</b></span>
                    <span class="dex-quota-tag">🎟️ 剩餘 ${Math.max(0, MAX_DRAWS - getUsedDraws(dexSelectedJob))} / ${MAX_DRAWS} 次</span>
                </div>
                <div class="dex-prog-track">
                    <div class="dex-prog-fill" style="width:${pct}%;background:${cfg.color}"></div>
                </div>
                <button type="button" class="dex-jump-series-btn" style="background:${cfg.color}" onclick="closeDex(); selectSeries('${String(dexSelectedJob).replace(/\\/g, '\\\\').replace(/'/g, "\\'")}'); window.scrollTo({ top: 0, behavior: 'smooth' });">🎁 去抽這個系列（${cfg.displayFolder || dexSelectedJob}）</button>
            </div>
        `;

        if (members.length === 0) {
            html += '<div style="grid-column:1/-1;text-align:center;padding:32px 10px;color:#947479;font-weight:700">此系列目前沒有可顯示的角色喔～</div>';
        } else {
            members.forEach(name => {
                const unlocked = drawnSet.has(name);
                if (unlocked) {
                    html += `<div class="dex-item"><img src="${cfg.folder}/${name}.jpg" alt="${name}" title="點擊放大檢視" onclick="openZoom('${cfg.folder}','${name}','${dexSelectedJob}')" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='${cfg.folder}/${name}.JPG';}else if(this.dataset.step==1){this.dataset.step=2;this.src='${cfg.folder}/${name}.png';}else{this.onerror=null;this.src='${cfg.folder}/${name}.PNG';}"><div class="dex-item-name">${name}</div><span class="dex-item-tag" style="background:${cfg.color}">已獲得</span></div>`;
                } else {
                    html += `<div class="dex-item locked"><img src="${cfg.folder}/${name}.jpg" alt="未收集" onerror="if(!this.dataset.step){this.dataset.step=1;this.src='${cfg.folder}/${name}.JPG';}else if(this.dataset.step==1){this.dataset.step=2;this.src='${cfg.folder}/${name}.png';}else{this.onerror=null;this.src='${cfg.folder}/${name}.PNG';}"><div class="dex-item-name">???</div><span class="dex-item-tag locked-tag">未收集</span></div>`;
                }
            });
        }
    }

    body.innerHTML = html;
    document.getElementById('dexModal').classList.add('open');
}

function openZoom(folder, name, job) {
    const zImg = document.getElementById('zoomImg');
    let step = 0;
    const exts = ['.jpg', '.JPG', '.png', '.PNG', '.webp'];
    zImg.onerror = function() {
        step++;
        if (step < exts.length) {
            this.src = folder + '/' + name + exts[step];
        } else {
            this.onerror = null;
        }
    };
    zImg.src = folder + '/' + name + exts[0];
    document.getElementById('zoomTitle').innerText = `🌸 ${job}・${name}`;
    document.getElementById('zoomModal').classList.add('open');
}

function closeZoom() {
    document.getElementById('zoomModal').classList.remove('open');
}

function normalizeJobName(rawName) {
    const keys = Object.keys(seriesConfig || {});
    const fallbackKey = keys[0] || "袋裝零食";
    if (!rawName) return fallbackKey;
    if (seriesConfig[rawName]) return rawName;
    const cleaned = window.HuajianMenu && typeof window.HuajianMenu.extractShortSeriesName === 'function'
        ? window.HuajianMenu.extractShortSeriesName(rawName)
        : rawName;
    if (seriesConfig[cleaned]) return cleaned;
    const matched = keys.find(k => rawName.includes(k) || k.includes(cleaned));
    return matched || fallbackKey;
}
